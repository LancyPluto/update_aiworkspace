name: Dev Branch CI/CD

# GitHub 官方 Actions 自 2026-06-16 起默认 Node 24；使用 v5/v6 系列避免 Node 20 弃用警告。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# push / PR → dev: CI; push to dev (含 PR merge) 或手动 dispatch → 生产 git 同步 + Docker 重建。
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      deploy_sync_mode:
        description: "Deploy sync mode (git=server git pull, rsync=incremental upload)"
        required: false
        default: git
        type: choice
        options:
          - git
          - rsync

concurrency:
  group: dev-delivery-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect changed paths (skip modules on PR when untouched) ────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      agent: ${{ steps.filter.outputs.agent }}
      worker: ${{ steps.filter.outputs.worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            agent:
              - 'agent-service/**'
            worker:
              - 'worker/**'
            frontend:
              - 'admin-frontend/**'
              - 'user-web/**'
            shared:
              - 'deploy/**'
              - '.github/**'
              - 'sql/**'
              - 'package.json'
              - 'package-lock.json'
              - 'requirements-dev.txt'
              - '.env.example'

  backend-test:
    name: Backend (Maven)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        working-directory: backend
        # surefire 并行已在 pom.xml 中配置，避免在 CI 命令行追加属性导致参数解析差异
        run: |
          mkdir -p ../ci-summary
          set -o pipefail
          mvn -B test -T 1C 2>&1 | tee ../ci-summary/backend-test.log
      - name: Summarize failure
        if: failure()
        run: python .github/scripts/ci_failure_summary.py build --job "Backend (Maven)" --log ci-summary/backend-test.log --out ci-summary/backend-test.md
      - name: Upload failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-summary-backend
          path: ci-summary/
          if-no-files-found: ignore

  agent-service-test:
    name: Agent Service (pytest)
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt
      - name: Install and test
        working-directory: agent-service
        run: |
          mkdir -p ../ci-summary
          set -o pipefail
          {
            pip install -r requirements.txt
            pytest -q
          } 2>&1 | tee ../ci-summary/agent-service-test.log
      - name: Summarize failure
        if: failure()
        run: python .github/scripts/ci_failure_summary.py build --job "Agent Service (pytest)" --log ci-summary/agent-service-test.log --out ci-summary/agent-service-test.md
      - name: Upload failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-summary-agent-service
          path: ci-summary/
          if-no-files-found: ignore

  worker-test:
    name: Worker (pytest)
    needs: changes
    if: needs.changes.outputs.worker == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install and test
        working-directory: worker
        run: |
          mkdir -p ../ci-summary
          set -o pipefail
          {
            pip install -r requirements.txt pytest
            pytest -q
          } 2>&1 | tee ../ci-summary/worker-test.log
      - name: Summarize failure
        if: failure()
        run: python .github/scripts/ci_failure_summary.py build --job "Worker (pytest)" --log ci-summary/worker-test.log --out ci-summary/worker-test.md
      - name: Upload failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-summary-worker
          path: ci-summary/
          if-no-files-found: ignore

  frontend-build:
    name: Frontends (build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            admin-frontend/package-lock.json
            user-web/package-lock.json
      - name: Build admin-frontend
        working-directory: admin-frontend
        run: |
          mkdir -p ../ci-summary
          set -o pipefail
          {
            npm ci
            npm run build
          } 2>&1 | tee ../ci-summary/frontend-build.log
      - name: Build user-web
        working-directory: user-web
        run: |
          mkdir -p ../ci-summary
          set -o pipefail
          {
            npm ci
            npm run build
          } 2>&1 | tee -a ../ci-summary/frontend-build.log
      - name: Summarize failure
        if: failure()
        run: python .github/scripts/ci_failure_summary.py build --job "Frontends (build)" --log ci-summary/frontend-build.log --out ci-summary/frontend-build.md
      - name: Upload failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-summary-frontend
          path: ci-summary/
          if-no-files-found: ignore

  # ── Python import/syntax validation ─────────────────────────────
  python-import-check:
    name: Python Import Validation
    needs: [changes, backend-test, agent-service-test, worker-test]
    if: |
      always() &&
      !cancelled() &&
      (needs.changes.outputs.agent == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.shared == 'true') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.agent-service-test.result == 'success' || needs.agent-service-test.result == 'skipped') &&
      (needs.worker-test.result == 'success' || needs.worker-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate agent-service syntax
        run: |
          echo "Checking agent-service Python syntax..."
          python -m compileall -q agent-service/app/ || exit 1
          echo "OK: agent-service syntax valid"

      - name: Validate worker syntax
        run: |
          echo "Checking worker Python syntax..."
          python -m compileall -q worker/ || exit 1
          echo "OK: worker syntax valid"

  # ── Dependency security audit ───────────────────────────────────
  security-audit:
    name: Dependency Security Audit
    needs: [changes, backend-test, agent-service-test, worker-test]
    if: |
      always() &&
      !cancelled() &&
      (needs.changes.outputs.agent == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.shared == 'true') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.agent-service-test.result == 'success' || needs.agent-service-test.result == 'skipped') &&
      (needs.worker-test.result == 'success' || needs.worker-test.result == 'skipped')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit agent-service dependencies
        run: pip-audit -r agent-service/requirements.txt --desc on 2>&1 | head -80 || true

      - name: Audit worker dependencies
        run: pip-audit -r worker/requirements.txt --desc on 2>&1 | head -80 || true

  ci-failure-notify:
    name: CI Failure Summary
    needs: [backend-test, agent-service-test, worker-test, frontend-build]
    if: |
      always() &&
      !cancelled() &&
      (needs.backend-test.result == 'failure' || needs.agent-service-test.result == 'failure' || needs.worker-test.result == 'failure' || needs.frontend-build.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download failure summaries
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ci-failure-summary-*
          path: ci-summary-collected
          merge-multiple: true

      - name: Write combined summary
        run: |
          echo "# CI 失败总览" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: ${{ needs.backend-test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Agent Service: ${{ needs.agent-service-test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: ${{ needs.worker-test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontends: ${{ needs.frontend-build.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "ci-summary-collected/*.md" > /dev/null; then
            for file in ci-summary-collected/*.md; do
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "没有找到失败摘要 artifact，请直接查看失败 job 日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send Gmail/SMTP notification
        env:
          CI_SUMMARY_SMTP_HOST: ${{ secrets.CI_SUMMARY_SMTP_HOST }}
          CI_SUMMARY_SMTP_PORT: ${{ secrets.CI_SUMMARY_SMTP_PORT }}
          CI_SUMMARY_SMTP_USERNAME: ${{ secrets.CI_SUMMARY_SMTP_USERNAME }}
          CI_SUMMARY_SMTP_PASSWORD: ${{ secrets.CI_SUMMARY_SMTP_PASSWORD }}
          CI_SUMMARY_MAIL_FROM: ${{ secrets.CI_SUMMARY_MAIL_FROM }}
          CI_SUMMARY_MAIL_TO: ${{ secrets.CI_SUMMARY_MAIL_TO }}
        run: python .github/scripts/ci_failure_summary.py mail --summary-dir ci-summary-collected

  deploy-production:
    name: Deploy to Production
    needs: [changes, backend-test, agent-service-test, worker-test, frontend-build, python-import-check]
    # 至少一个模块有变更，且事件为 push 到 dev 或手动触发时才部署
    if: |
      always() &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.agent-service-test.result == 'success' || needs.agent-service-test.result == 'skipped') &&
      (needs.worker-test.result == 'success' || needs.worker-test.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped') &&
      (needs.python-import-check.result == 'success' || needs.python-import-check.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: http://wlcloudai.com
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PASSWORD" ]; then
            echo "::error::Missing GitHub Actions secrets. Configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD."
            exit 1
          fi

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Detect changed services
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          CHANGED="$(bash deploy/scripts/detect_deploy_changes.sh || true)"
          echo "Changed files:"
          echo "$CHANGED"
          if [ -n "$CHANGED" ]; then
            mapfile -t FILES <<< "$CHANGED"
            SERVICES="$(bash deploy/scripts/detect_deploy_services.sh "${FILES[@]}")"
          else
            SERVICES="$(bash deploy/scripts/detect_deploy_services.sh)"
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Deploy services: $SERVICES"

      - name: Deploy via SSH (git sync)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SYNC_MODE: ${{ github.event.inputs.deploy_sync_mode || 'git' }}
          DEPLOY_SERVICES: ${{ steps.changes.outputs.services }}
          DEPLOY_GIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash deploy/scripts/ci_remote_deploy_light.sh

      - name: External smoke check
        run: |
          for url in http://wlcloudai.com/ http://wlcloudai.com/api/health; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)"
            echo "$url -> $code"
            if [ "$code" = "000" ]; then
              echo "::warning::Could not reach $url from GitHub runner (DNS/firewall may block external check)."
            fi
          done
