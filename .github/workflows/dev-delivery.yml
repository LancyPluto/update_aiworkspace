name: Dev Branch CI/CD

# GitHub 官方 Actions 自 2026-06-16 起默认 Node 24；使用 v5/v6 系列避免 Node 20 弃用警告。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# push / PR → dev: CI; push to dev (含 PR merge) 或手动 dispatch → 生产 git 同步 + Docker 重建。
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      deploy_sync_mode:
        description: "Deploy sync mode (git=server git pull, rsync=incremental upload)"
        required: false
        default: git
        type: choice
        options:
          - git
          - rsync

concurrency:
  group: dev-delivery-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        working-directory: backend
        run: mvn -B test

  agent-service-test:
    name: Agent Service (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt
      - name: Install and test
        working-directory: agent-service
        run: |
          pip install -r requirements.txt
          pytest -q

  worker-test:
    name: Worker (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install and test
        working-directory: worker
        run: |
          pip install -r requirements.txt pytest
          pytest -q

  frontend-build:
    name: Frontends (build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            admin-frontend/package-lock.json
            user-web/package-lock.json
      - name: Build admin-frontend
        working-directory: admin-frontend
        run: |
          npm ci
          npm run build
      - name: Build user-web
        working-directory: user-web
        run: |
          npm ci
          npm run build

  deploy-production:
    name: Deploy to Production
    needs: [backend-test, agent-service-test, worker-test, frontend-build]
    # 仅 push 到 dev（含 PR merge 后的 push）或手动触发时部署；PR 打开/同步只跑 CI，不碰生产。
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: http://wlcloudai.com
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PASSWORD" ]; then
            echo "::error::Missing GitHub Actions secrets. Configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD."
            exit 1
          fi

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Detect changed services
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          CHANGED="$(bash deploy/scripts/detect_deploy_changes.sh || true)"
          echo "Changed files:"
          echo "$CHANGED"
          if [ -n "$CHANGED" ]; then
            mapfile -t FILES <<< "$CHANGED"
            SERVICES="$(bash deploy/scripts/detect_deploy_services.sh "${FILES[@]}")"
          else
            SERVICES="$(bash deploy/scripts/detect_deploy_services.sh)"
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Deploy services: $SERVICES"

      - name: Deploy via SSH (git sync)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SYNC_MODE: ${{ github.event.inputs.deploy_sync_mode || 'git' }}
          DEPLOY_SERVICES: ${{ steps.changes.outputs.services }}
          DEPLOY_GIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash deploy/scripts/ci_remote_deploy_light.sh

      - name: External smoke check
        run: |
          for url in http://wlcloudai.com/ http://wlcloudai.com/api/health; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)"
            echo "$url -> $code"
            if [ "$code" = "000" ]; then
              echo "::warning::Could not reach $url from GitHub runner (DNS/firewall may block external check)."
            fi
          done
