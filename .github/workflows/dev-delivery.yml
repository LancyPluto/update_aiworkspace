name: Dev Branch CI/CD

# GitHub 官方 Actions 自 2026-06-16 起默认 Node 24；使用 v5/v6 系列避免 Node 20 弃用警告。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# push / PR → dev: CI; push to dev (含 PR merge) 或手动 dispatch → 生产 git 同步 + Docker 重建。
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      deploy_sync_mode:
        description: "Deploy sync mode (production requires git)"
        required: false
        default: git
        type: choice
        options:
          - git

concurrency:
  group: dev-delivery-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect changed paths (skip modules on PR when untouched) ────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      agent: ${{ steps.filter.outputs.agent }}
      worker: ${{ steps.filter.outputs.worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            agent:
              - 'agent-service/**'
            worker:
              - 'worker/**'
            frontend:
              - 'admin-frontend/**'
              - 'user-web/**'
            shared:
              - 'deploy/**'
              - '.github/**'
              - 'sql/**'
              - 'package.json'
              - 'package-lock.json'
              - 'requirements-dev.txt'
              - '.env.example'

  backend-test:
    name: Backend (Maven)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        working-directory: backend
        # surefire 并行已在 pom.xml 中配置，避免在 CI 命令行追加属性导致参数解析差异
        run: mvn -B test -T 1C

  agent-service-test:
    name: Agent Service (pytest)
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt
      - name: Install and test
        working-directory: agent-service
        run: |
          pip install -r requirements.txt
          pytest -q

  worker-test:
    name: Worker (pytest)
    needs: changes
    if: needs.changes.outputs.worker == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install and test
        working-directory: worker
        run: |
          pip install -r requirements.txt pytest
          pytest -q

  frontend-build:
    name: Frontends (quality gates)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            admin-frontend/package-lock.json
            user-web/package-lock.json
      - name: Test, lint and build admin-frontend
        working-directory: admin-frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run lint
          npm run build
      - name: Test and build user-web
        working-directory: user-web
        run: |
          npm ci
          npm test
          npm run build

  deploy-contract-test:
    name: Deploy Contracts
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Validate deploy scripts
        run: |
          bash -n deploy/scripts/*.sh
          python -m unittest deploy/scripts/test_deploy_contracts.py
      - name: Validate nginx configuration
        run: |
          cert_dir="$(mktemp -d)"
          trap 'rm -rf "$cert_dir"' EXIT
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$cert_dir/wlcloudai.com.key" \
            -out "$cert_dir/wlcloudai.com.pem" \
            -subj "/CN=localhost" -days 1 >/dev/null 2>&1
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host admin-frontend:127.0.0.1 \
            --mount type=bind,source="$PWD/deploy/nginx/default.conf",target=/etc/nginx/conf.d/default.conf,readonly \
            --mount type=bind,source="$PWD/deploy/nginx/snippets",target=/etc/nginx/conf.d/snippets,readonly \
            --mount type=bind,source="$cert_dir",target=/etc/nginx/certs,readonly \
            nginx:1.27-alpine nginx -t

  # ── Python import/syntax validation ─────────────────────────────
  python-import-check:
    name: Python Import Validation
    needs: [changes, backend-test, agent-service-test, worker-test]
    if: |
      always() &&
      !cancelled() &&
      (needs.changes.outputs.agent == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.shared == 'true') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.agent-service-test.result == 'success' || needs.agent-service-test.result == 'skipped') &&
      (needs.worker-test.result == 'success' || needs.worker-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate agent-service syntax
        run: |
          echo "Checking agent-service Python syntax..."
          python -m compileall -q agent-service/app/ || exit 1
          echo "OK: agent-service syntax valid"

      - name: Validate worker syntax
        run: |
          echo "Checking worker Python syntax..."
          python -m compileall -q worker/ || exit 1
          echo "OK: worker syntax valid"

  # ── Dependency security audit ───────────────────────────────────
  security-audit:
    name: Dependency Security Audit
    needs: [changes, backend-test, agent-service-test, worker-test]
    if: |
      always() &&
      !cancelled() &&
      (needs.changes.outputs.agent == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.shared == 'true') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.agent-service-test.result == 'success' || needs.agent-service-test.result == 'skipped') &&
      (needs.worker-test.result == 'success' || needs.worker-test.result == 'skipped')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit agent-service dependencies
        run: pip-audit -r agent-service/requirements.txt --desc on 2>&1 | head -80 || true

      - name: Audit worker dependencies
        run: pip-audit -r worker/requirements.txt --desc on 2>&1 | head -80 || true

  deploy-production:
    name: Deploy to Production
    needs: [changes, backend-test, agent-service-test, worker-test, frontend-build, deploy-contract-test, python-import-check]
    # 至少一个模块有变更，且事件为 push 到 dev 或手动触发时才部署
    if: |
      always() &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.agent-service-test.result == 'success' || needs.agent-service-test.result == 'skipped') &&
      (needs.worker-test.result == 'success' || needs.worker-test.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped') &&
      (needs.deploy-contract-test.result == 'success' || needs.deploy-contract-test.result == 'skipped') &&
      (needs.python-import-check.result == 'success' || needs.python-import-check.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: http://wlcloudai.com
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PASSWORD" ]; then
            echo "::error::Missing GitHub Actions secrets. Configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD."
            exit 1
          fi

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Generate ephemeral MySQL preflight account
        shell: bash
        run: |
          username="ci_pf_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "PRODUCTION_PREFLIGHT_MYSQL_USER=$username" >> "$GITHUB_ENV"
          echo "PRODUCTION_PREFLIGHT_MYSQL_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Detect changed services
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          CHANGED="$(bash deploy/scripts/detect_deploy_changes.sh || true)"
          echo "Changed files:"
          echo "$CHANGED"
          if [ -n "$CHANGED" ]; then
            mapfile -t FILES <<< "$CHANGED"
            SERVICES="$(bash deploy/scripts/detect_deploy_services.sh "${FILES[@]}")"
          else
            SERVICES="$(bash deploy/scripts/detect_deploy_services.sh)"
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Deploy services: $SERVICES"

      - name: Deploy via SSH (git sync)
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SYNC_MODE: ${{ github.event.inputs.deploy_sync_mode || 'git' }}
          DEPLOY_SERVICES: ${{ steps.changes.outputs.services }}
          DEPLOY_GIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash deploy/scripts/ci_remote_deploy_light.sh
