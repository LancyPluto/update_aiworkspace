name: 开发分支 CI/CD

# GitHub 官方 Actions 自 2026-06-16 起默认 Node 24；使用 v5/v6 系列避免 Node 20 弃用警告。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# push / PR → dev: CI; push to dev (含 PR merge) 或手动 dispatch → 生产 git 同步 + Docker 重建。
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      deploy_sync_mode:
        description: "Deploy sync mode (production requires git)"
        required: false
        default: git
        type: choice
        options:
          - git

concurrency:
  group: dev-delivery-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fork-pr-policy:
    name: 拒绝外部 Fork PR 使用自托管 CI
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: [self-hosted, linux, x64, ci-isolated]
    permissions: {}
    steps:
      - name: 拒绝不受信任的 Fork 代码
        run: |
          echo "::error::Fork pull requests cannot run on this repository's persistent self-hosted runner."
          exit 1

  # ── Detect changed paths (skip modules on PR when untouched) ────
  changes:
    name: 识别变更范围
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ci-isolated]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      agent: ${{ steps.filter.outputs.agent }}
      worker: ${{ steps.filter.outputs.worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 按路径识别变更
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            agent:
              - 'agent-service/**'
            worker:
              - 'worker/**'
            frontend:
              - 'admin-frontend/**'
              - 'user-web/**'
            shared:
              - 'deploy/**'
              - '.github/**'
              - 'sql/**'
              - 'package.json'
              - 'package-lock.json'
              - 'requirements-dev.txt'
              - '.env.example'

  backend-test:
    name: 后端测试（Maven）
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: [self-hosted, linux, x64, ci-isolated]
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: 运行后端测试
        working-directory: backend
        # surefire 并行已在 pom.xml 中配置，避免在 CI 命令行追加属性导致参数解析差异
        run: mvn -B test -T 2

  agent-service-test:
    name: Agent 服务测试（pytest）
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.changes.outputs.agent == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: [self-hosted, linux, x64, ci-isolated]
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装依赖并运行 Agent 测试
        working-directory: agent-service
        run: |
          pip install -r requirements.txt
          pytest -q

  worker-test:
    name: Worker 测试（pytest）
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.changes.outputs.worker == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: [self-hosted, linux, x64, ci-isolated]
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装依赖并运行 Worker 测试
        working-directory: worker
        run: |
          pip install -r requirements.txt pytest
          pytest -q

  frontend-build:
    name: 前端质量门禁
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: [self-hosted, linux, x64, ci-isolated]
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: 测试、检查并构建管理端
        working-directory: admin-frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run lint
          npm run build
      - name: 测试并构建用户端
        working-directory: user-web
        run: |
          npm ci
          npm test
          npm run build

  deploy-contract-test:
    name: 部署契约检查
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.shared == 'true'
    runs-on: [self-hosted, linux, x64, ci-isolated]
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 验证部署脚本
        run: |
          bash -n deploy/scripts/*.sh
          python3 -m unittest deploy/scripts/test_deploy_contracts.py
      - name: 验证 Nginx 配置
        run: |
          cert_dir="$(mktemp -d)"
          trap 'rm -rf "$cert_dir"' EXIT
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$cert_dir/wlcloudai.com.key" \
            -out "$cert_dir/wlcloudai.com.pem" \
            -subj "/CN=localhost" -days 1 >/dev/null 2>&1
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host admin-frontend:127.0.0.1 \
            --mount type=bind,source="$PWD/deploy/nginx/default.conf",target=/etc/nginx/conf.d/default.conf,readonly \
            --mount type=bind,source="$PWD/deploy/nginx/snippets",target=/etc/nginx/conf.d/snippets,readonly \
            --mount type=bind,source="$cert_dir",target=/etc/nginx/certs,readonly \
            docker.io/library/nginx:1.30.4-alpine nginx -t

  # ── Python import/syntax validation ─────────────────────────────
  python-import-check:
    name: Python 导入与语法检查
    needs: [changes, backend-test, agent-service-test, worker-test]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      always() &&
      !cancelled() &&
      (needs.changes.outputs.agent == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.shared == 'true') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.agent-service-test.result == 'success' || needs.agent-service-test.result == 'skipped') &&
      (needs.worker-test.result == 'success' || needs.worker-test.result == 'skipped')
    runs-on: [self-hosted, linux, x64, ci-isolated]
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 配置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 验证 Agent 服务语法
        run: |
          echo "Checking agent-service Python syntax..."
          python -m compileall -q agent-service/app/ || exit 1
          echo "OK: agent-service syntax valid"

      - name: 验证 Worker 语法
        run: |
          echo "Checking worker Python syntax..."
          python -m compileall -q worker/ || exit 1
          echo "OK: worker syntax valid"

  # ── Dependency security audit ───────────────────────────────────
  security-audit:
    name: 依赖安全审计
    needs: [changes, backend-test, agent-service-test, worker-test]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      always() &&
      !cancelled() &&
      (needs.changes.outputs.agent == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.shared == 'true') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.agent-service-test.result == 'success' || needs.agent-service-test.result == 'skipped') &&
      (needs.worker-test.result == 'success' || needs.worker-test.result == 'skipped')
    continue-on-error: true
    runs-on: [self-hosted, linux, x64, ci-isolated]
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 配置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装 pip-audit
        run: pip install pip-audit

      - name: 审计 Agent 服务依赖
        run: pip-audit -r agent-service/requirements.txt --desc on 2>&1 | head -80 || true

      - name: 审计 Worker 依赖
        run: pip-audit -r worker/requirements.txt --desc on 2>&1 | head -80 || true

  deploy-production:
    name: 部署到生产环境
    needs: [changes, backend-test, agent-service-test, worker-test, frontend-build, deploy-contract-test, python-import-check]
    # 至少一个模块有变更，且事件为 push 到 dev 或手动触发时才部署
    if: |
      always() &&
      !cancelled() &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.agent-service-test.result == 'success' || needs.agent-service-test.result == 'skipped') &&
      (needs.worker-test.result == 'success' || needs.worker-test.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped') &&
      (needs.deploy-contract-test.result == 'success' || needs.deploy-contract-test.result == 'skipped') &&
      (needs.python-import-check.result == 'success' || needs.python-import-check.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.worker == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true') &&
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev')
    runs-on: [self-hosted, linux, x64, production-deploy]
    timeout-minutes: 45
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: http://wlcloudai.com
    env:
      CD_CREDENTIALS_FILE: /home/runner/.config/ai-tool-market/deploy.env
      DEPLOY_KNOWN_HOSTS_FILE: /home/runner/.ssh/known_hosts
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: 识别待部署服务
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          CHANGED="$(bash deploy/scripts/detect_deploy_changes.sh || true)"
          echo "Changed files:"
          echo "$CHANGED"
          if [ -n "$CHANGED" ]; then
            mapfile -t FILES <<< "$CHANGED"
            SERVICES="$(bash deploy/scripts/detect_deploy_services.sh "${FILES[@]}")"
          else
            SERVICES="$(bash deploy/scripts/detect_deploy_services.sh)"
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Deploy services: $SERVICES"

      - name: 通过 SSH 部署（Git 同步）
        id: deploy
        env:
          DEPLOY_SYNC_MODE: ${{ github.event.inputs.deploy_sync_mode || 'git' }}
          DEPLOY_SERVICES: ${{ steps.changes.outputs.services }}
          DEPLOY_GIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          mask_value() {
            local escaped="$1"
            escaped="${escaped//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            printf '::add-mask::%s\n' "$escaped"
          }

          if [ ! -f "$CD_CREDENTIALS_FILE" ] || [ -L "$CD_CREDENTIALS_FILE" ]; then
            echo "::error::Missing regular local credential file: $CD_CREDENTIALS_FILE"
            exit 1
          fi
          if [ "$(stat -c '%a' "$CD_CREDENTIALS_FILE")" != "600" ] || [ "$(stat -c '%u' "$CD_CREDENTIALS_FILE")" != "$(id -u)" ]; then
            echo "::error::Local credential file must be owned by the runner user with mode 600."
            exit 1
          fi

          set -a
          source "$CD_CREDENTIALS_FILE"
          set +a
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD; do
            value="${!variable:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing $variable in $CD_CREDENTIALS_FILE"
              exit 1
            fi
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::$variable must be a single-line value"
              exit 1
            fi
            mask_value "$value"
          done

          export PRODUCTION_PREFLIGHT_MYSQL_USER="ci_pf_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          export PRODUCTION_PREFLIGHT_MYSQL_PASSWORD="$(openssl rand -hex 24)"
          mask_value "$PRODUCTION_PREFLIGHT_MYSQL_PASSWORD"
          bash deploy/scripts/ci_remote_deploy_light.sh
