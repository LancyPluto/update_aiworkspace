[project]
name = "ai-task-worker"
version = "0.1.0"
description = "AI 超市：Redis 队列消费、模型调用、任务状态回写"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "redis>=5,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
ai-task-worker = "ai_task_worker.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_task_worker*"]

[tool.ruff]
line-length = 100
target-version = "py39"
