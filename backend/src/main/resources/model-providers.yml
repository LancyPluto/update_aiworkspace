providers:
  - code: mock
    label: Mock (dev)
    capabilities:
      - TEXT_GENERATION
    defaultBaseUrl: ""
    defaultModel: mock
    billingDefault: TOKEN_PER_M
    testStrategy: agent_service
    workerReady: true
    description: Local development mock responses.

  - code: local_media_mock
    label: Local media mock
    capabilities:
      - IMAGE_GENERATION
      - VIDEO_GENERATION
    defaultBaseUrl: ""
    defaultModel: local-media-mock
    billingDefault: PER_CALL
    testStrategy: accept_only
    workerReady: true
    description: Local mock image/video generator used for development and fallback media tests.

  - code: openai_compatible
    label: OpenAI compatible
    capabilities:
      - TEXT_GENERATION
      - VISION_INPUT
    defaultBaseUrl: https://api.openai.com/v1
    defaultModel: gpt-4o-mini
    billingDefault: TOKEN_PER_M
    testStrategy: agent_service
    workerReady: true
    description: OpenAI-compatible chat completions endpoint.

  - code: deepseek
    label: DeepSeek
    capabilities:
      - TEXT_GENERATION
    defaultBaseUrl: https://api.deepseek.com
    defaultModel: deepseek-v4-flash
    billingDefault: TOKEN_PER_M
    testStrategy: agent_service
    workerReady: true
    description: DeepSeek chat completions API using the OpenAI-compatible protocol.

  - code: qwen
    label: Alibaba Cloud Bailian Qwen
    capabilities:
      - TEXT_GENERATION
      - VISION_INPUT
    defaultBaseUrl: https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    defaultModel: qwen3.6-plus
    billingDefault: TOKEN_PER_M
    providerProtocol: openai_chat
    vendorKind: direct
    upstreamVendor: aliyun_bailian
    testStrategy: agent_service
    workerReady: true
    authSchemaJson: '{"fields":[{"key":"apiKey","label":"DASHSCOPE_API_KEY","type":"password","required":true},{"key":"baseUrl","label":"Base URL","type":"url","required":true,"placeholder":"https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"}]}'
    modelParamSchemaJson: '{"models":["qwen3.6-plus"],"fields":[{"key":"modelName","label":"模型名称","type":"text","required":true},{"key":"capabilities","label":"能力","type":"multi_select","options":["TEXT_GENERATION","VISION_INPUT"],"required":true}]}'
    description: Alibaba Cloud Model Studio Bailian Qwen OpenAI-compatible Chat Completions endpoint. Use qwen3.6-plus with VISION_INPUT for Agent image understanding.

  - code: dashscope_qwen_tts
    label: Alibaba Cloud Qwen Audio TTS
    capabilities:
      - TEXT_TO_SPEECH
    defaultBaseUrl: https://dashscope.aliyuncs.com
    defaultModel: qwen3-tts-flash
    billingDefault: PER_CHARACTER
    providerProtocol: dashscope_qwen_tts
    vendorKind: direct
    upstreamVendor: qwen
    testStrategy: accept_only
    workerReady: true
    adapterInstalled: true
    adapterKey: dashscope_qwen_tts
    metadataVersion: dashscope_qwen_tts.v1
    authSchemaJson: '{"fields":[{"key":"apiKey","label":"DASHSCOPE_API_KEY","type":"password","required":true},{"key":"baseUrl","label":"Base URL","type":"url","required":false,"placeholder":"https://dashscope.aliyuncs.com"}]}'
    modelParamSchemaJson: '{"models":["qwen3-tts-flash","qwen-audio-3.0-tts-plus"],"fields":[{"key":"modelName","label":"模型名称","type":"text","required":true},{"key":"billingUnit","label":"计费单位","type":"select","options":["PER_CHARACTER"],"required":true},{"key":"capabilities","label":"能力","type":"multi_select","options":["TEXT_TO_SPEECH"],"required":true}]}'
    description: Alibaba Cloud Model Studio TTS; the adapter selects the multimodal-generation or SpeechSynthesizer protocol by model name.

  - code: anthropic_compatible
    label: Anthropic compatible
    capabilities:
      - TEXT_GENERATION
      - VISION_INPUT
    defaultBaseUrl: https://api.minimaxi.com/anthropic
    defaultModel: MiniMax-M2.7
    billingDefault: TOKEN_PER_M
    testStrategy: agent_service
    workerReady: true
    description: Anthropic-compatible gateway (e.g. MiniMax M2.7).

  - code: minimax
    label: MiniMax chat
    capabilities:
      - TEXT_GENERATION
    defaultBaseUrl: https://api.minimaxi.com/v1
    defaultModel: MiniMax-M2.7
    billingDefault: TOKEN_PER_M
    testStrategy: agent_service
    workerReady: true
    description: MiniMax chat completion API for text tools and agent.

  - code: siliconflow_images
    label: SiliconFlow images
    capabilities:
      - IMAGE_GENERATION
    defaultBaseUrl: https://api.siliconflow.cn
    defaultModel: Tongyi-MAI/Z-Image-Turbo
    billingDefault: PER_CALL
    testStrategy: accept_only
    workerReady: true
    description: SiliconFlow /v1/images/generations and digital-human worker pipeline.

  - code: volcengine_images
    label: Volcengine images
    capabilities:
      - IMAGE_GENERATION
    defaultBaseUrl: https://ark.cn-beijing.volces.com
    defaultModel: doubao-seedream-4-5-251128
    billingDefault: PER_CALL
    testStrategy: accept_only
    workerReady: true
    description: Volcengine Ark image generation models such as Doubao Seedream.

  - code: minimax_music
    label: MiniMax music
    capabilities:
      - MUSIC_GENERATION
    defaultBaseUrl: https://api.minimaxi.com
    defaultModel: music-2.6-free
    billingDefault: PER_CALL
    testStrategy: accept_only
    workerReady: false
    description: MiniMax /v1/music_generation (worker handler pending).

  - code: suno_music
    label: Suno music
    capabilities:
      - MUSIC_GENERATION
    defaultBaseUrl: https://api.sunoapi.org
    defaultModel: V5
    billingDefault: PER_CALL
    testStrategy: accept_only
    workerReady: true
    adapterInstalled: true
    adapterKey: suno_music
    metadataVersion: suno_music.v1
    authSchemaJson: '{"fields":[{"key":"apiKey","label":"API Key","type":"password","required":true},{"key":"baseUrl","label":"Base URL","type":"url","required":false}]}'
    modelParamSchemaJson: '{"models":["V5_5","V5","V4_5PLUS","V4_5ALL","V4_5","V4"],"fields":[{"key":"modelName","label":"模型名","type":"text","required":true},{"key":"billingUnit","label":"计费单位","type":"select","options":["PER_CALL"],"required":true}]}'
    description: SunoAPI /api/v1/generate music generation with worker polling and local audio persistence.

  - code: minimax_speech
    label: MiniMax speech
    capabilities:
      - TEXT_TO_SPEECH
    defaultBaseUrl: https://api.minimaxi.com
    defaultModel: speech-2.8-hd
    billingDefault: PER_CALL
    testStrategy: accept_only
    workerReady: true
    description: MiniMax /v1/t2a_async_v2 asynchronous text-to-speech.

  - code: siliconflow_speech
    label: SiliconFlow TTS
    capabilities:
      - TEXT_TO_SPEECH
    defaultBaseUrl: https://api.siliconflow.cn
    defaultModel: FunAudioLLM/CosyVoice2-0.5B
    billingDefault: PER_CALL
    testStrategy: accept_only
    workerReady: true
    description: SiliconFlow /v1/audio/speech for standalone TTS tools.

  - code: siliconflow_asr
    label: SiliconFlow ASR
    capabilities:
      - SPEECH_TO_TEXT
    defaultBaseUrl: https://api.siliconflow.cn
    defaultModel: TeleAI/TeleSpeechASR
    billingDefault: PER_CALL
    testStrategy: accept_only
    workerReady: false
    description: SiliconFlow speech recognition model reserved for subtitle alignment and speech-to-text workflows.

  - code: seedance
    label: Seedance video
    capabilities:
      - VIDEO_GENERATION
    defaultBaseUrl: https://ark.cn-beijing.volces.com
    defaultModel: doubao-seedance-1-5-pro-251215
    billingDefault: PER_CALL
    testStrategy: accept_only
    workerReady: true
    description: Seedance image-to-video generation used by digital-human and comic-drama pipelines.

  - code: infinitetalk
    label: InfiniteTalk video
    capabilities:
      - VIDEO_GENERATION
    defaultBaseUrl: http://host.docker.internal:7860
    defaultModel: MeiGen-AI/InfiniteTalk
    billingDefault: PER_CALL
    providerProtocol: infinitetalk_async
    vendorKind: direct
    upstreamVendor: infinitetalk
    testStrategy: accept_only
    workerReady: true
    description: InfiniteTalk audio-driven video generation for the digital-human pipeline.

  - code: kling_video
    label: Kling video/images
    capabilities:
      - VIDEO_GENERATION
      - IMAGE_GENERATION
    defaultBaseUrl: https://api-beijing.klingai.com
    defaultModel: kling-v2-6
    billingDefault: PER_CALL
    testStrategy: accept_only
    workerReady: true
    subjectElementSupport: true
    subjectSyncModes:
      - image_refer
      - video_refer
    description: Kling official text/image-to-video and image generation API. Configure AK/SK in extra auth JSON.

  - code: bailian_happyhorse
    label: Bailian HappyHorse
    capabilities:
      - VIDEO_GENERATION
    defaultBaseUrl: https://dashscope.aliyuncs.com
    defaultModel: happyhorse-1.0-t2v
    billingDefault: PER_SECOND
    testStrategy: accept_only
    workerReady: true
    description: Alibaba Cloud Bailian/DashScope HappyHorse video generation models.

  - code: ofox_openai_images
    label: oFox OpenAI images gateway
    capabilities:
      - IMAGE_GENERATION
    defaultBaseUrl: https://api.ofox.ai/v1
    defaultModel: openai/gpt-image-2
    billingDefault: IMAGE_TOKEN
    providerProtocol: openai_images
    vendorKind: gateway
    upstreamVendor: openai
    testStrategy: agent_service
    workerReady: true
    description: oFox gateway for OpenAI-compatible image generation models. Change Base URL/API Key to switch compatible gateways.

  - code: openai_images_gateway
    label: OpenAI images compatible gateway
    capabilities:
      - IMAGE_GENERATION
    defaultBaseUrl: https://api.ofox.ai/v1
    defaultModel: openai/gpt-image-2
    billingDefault: IMAGE_TOKEN
    providerProtocol: openai_images
    vendorKind: gateway
    upstreamVendor: openai
    testStrategy: agent_service
    workerReady: true
    description: Generic gateway slot for OpenAI-compatible image generation APIs. Use this when only Base URL/API Key changes.

  - code: agnes_chat
    label: Agnes AI chat
    capabilities:
      - TEXT_GENERATION
      - VISION_INPUT
    defaultBaseUrl: https://apihub.agnes-ai.com/v1
    defaultModel: agnes-2.0-flash
    billingDefault: TOKEN_PER_M
    providerProtocol: openai_chat
    vendorKind: direct
    upstreamVendor: agnes
    testStrategy: agent_service
    workerReady: true
    description: Agnes AI OpenAI-compatible chat completions models such as agnes-2.0-flash.

  - code: agnes_images
    label: Agnes AI images
    capabilities:
      - IMAGE_GENERATION
    defaultBaseUrl: https://apihub.agnes-ai.com/v1
    defaultModel: agnes-image-2.1-flash
    billingDefault: IMAGE_TOKEN
    providerProtocol: openai_images
    vendorKind: direct
    upstreamVendor: agnes
    testStrategy: accept_only
    workerReady: true
    description: Agnes Image 2.x Flash models via /v1/images/generations with Agnes extra_body response format.

  - code: agnes_video
    label: Agnes AI video
    capabilities:
      - VIDEO_GENERATION
    defaultBaseUrl: https://apihub.agnes-ai.com
    defaultModel: agnes-video-v2.0
    billingDefault: PER_CALL
    providerProtocol: agnes_video
    vendorKind: direct
    upstreamVendor: agnes
    testStrategy: accept_only
    workerReady: true
    description: Agnes Video V2.0 asynchronous video generation API using /v1/videos and video_id result polling.

  - code: worker_video
    label: Video generation (stub)
    capabilities:
      - VIDEO_GENERATION
    defaultBaseUrl: https://api.siliconflow.cn
    defaultModel: video-stub
    billingDefault: PER_CALL
    testStrategy: accept_only
    workerReady: true
    description: Video generation worker placeholder until provider API is wired.

  - code: vidu_video
    label: Vidu video
    capabilities:
      - VIDEO_GENERATION
      - IMAGE_GENERATION
    defaultBaseUrl: https://api.vidu.com
    defaultModel: viduq3-pro
    billingDefault: PER_CALL
    providerProtocol: vidu_async
    vendorKind: direct
    upstreamVendor: vidu
    testStrategy: accept_only
    workerReady: false
    description: Vidu (Shengshu) async video generation API. Endpoints under /ent/v2/* (text2video / img2video / reference2video / start-end2video / extend / multi-frame / upscale / lipsync / motion-sync / digital-human / text2image / reference2image). Token auth, 24h result URL TTL.

  - code: vidu_audio
    label: Vidu audio
    capabilities:
      - AUDIO_GENERATION
    defaultBaseUrl: https://api.vidu.com
    defaultModel: audio-1.0
    billingDefault: PER_CALL
    providerProtocol: vidu_async
    vendorKind: direct
    upstreamVendor: vidu
    testStrategy: accept_only
    workerReady: false
    description: Vidu audio capabilities (text2audio / timing2audio / text2speech / voice-clone). Token auth.
