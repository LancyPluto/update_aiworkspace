server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-tool-market-backend
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    # utf8mb4：与库表一致，避免中文乱码；勿用 JDBC 的 utf8（MySQL 历史 3 字节别名）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ai_supermarket_v1}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      connection-init-sql: ${MYSQL_CONNECTION_INIT_SQL:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s

app:
  production-mode: ${APP_PRODUCTION_MODE:false}
  jwt-secret: ${JWT_SECRET:local-dev-secret}
  internal-api-token: ${INTERNAL_API_TOKEN:local-internal-token}
  ai-task-queue: ${AI_TASK_QUEUE:ai:task:queue}
  task-queue-backend: ${TASK_QUEUE_BACKEND:rabbitmq}
  generated-media-dir: ${GENERATED_MEDIA_DIR:../data/generated-media}
  rabbitmq:
    task-exchange: ${RABBITMQ_TASK_EXCHANGE:ai.task.exchange}
    task-routing-key: ${RABBITMQ_TASK_ROUTING_KEY:tool.normal}
    task-queue: ${RABBITMQ_TASK_QUEUE:ai.tool.normal}
    dead-queue: ${RABBITMQ_TASK_DEAD_QUEUE:ai.tool.normal.dead}
    retry-queue-prefix: ${RABBITMQ_TASK_RETRY_QUEUE_PREFIX:ai.tool.normal.retry}
    retry-delays-ms: ${RABBITMQ_TASK_RETRY_DELAYS_MS:5000,30000,120000}
  auth:
    captcha:
      enabled: ${ALIYUN_CAPTCHA_ENABLED:false}
      provider: ${CAPTCHA_PROVIDER:aliyun}
      region: ${ALIYUN_CAPTCHA_REGION:cn}
      scene-id: ${ALIYUN_CAPTCHA_SCENE_ID:}
      endpoint: ${ALIYUN_CAPTCHA_ENDPOINT:}
      access-key-id: ${ALIYUN_CAPTCHA_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_CAPTCHA_ACCESS_KEY_SECRET:}
    sms:
      provider: ${SMS_PROVIDER:local}
      bmob-application-id: ${BMOB_APPLICATION_ID:}
      bmob-rest-api-key: ${BMOB_REST_API_KEY:}
      bmob-base-url: ${BMOB_BASE_URL:https://api.bmob.cn}
      bmob-template: ${BMOB_SMS_TEMPLATE:}
      ihuyi-api-id: ${IHUYI_API_ID:}
      ihuyi-api-key: ${IHUYI_API_KEY:}
      ihuyi-base-url: ${IHUYI_BASE_URL:https://api.ihuyi.com/sms/Submit.json}
      ihuyi-template-id: ${IHUYI_TEMPLATE_ID:1}
      aliyun-access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:${ALIYUN_CAPTCHA_ACCESS_KEY_ID:${ALIYUN_ACCESS_KEY_ID:}}}
      aliyun-access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:${ALIYUN_CAPTCHA_ACCESS_KEY_SECRET:${ALIYUN_ACCESS_KEY_SECRET:}}}
      aliyun-endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
      aliyun-sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      aliyun-template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
      aliyun-template-param-name: ${ALIYUN_SMS_TEMPLATE_PARAM_NAME:code}
  agent:
    enabled: ${AGENT_ENABLED:true}
    service-base-url: ${AGENT_SERVICE_BASE_URL:http://127.0.0.1:8090}
    max-active-runs-per-user: ${AGENT_MAX_ACTIVE_RUNS_PER_USER:1}
    max-messages-per-minute: ${AGENT_MAX_MESSAGES_PER_MINUTE:10}
    max-runs-per-hour: ${AGENT_MAX_RUNS_PER_HOUR:30}
    default-credit-budget: ${AGENT_DEFAULT_CREDIT_BUDGET:20}
    max-history-messages: ${AGENT_MAX_HISTORY_MESSAGES:20}
    file-storage-dir: ${AGENT_FILE_STORAGE_DIR:data/agent-files}
    worker-media-base-url: ${WORKER_MEDIA_BASE_URL:http://backend:8080}
  payment:
    wechat-native:
      enabled: ${WECHAT_NATIVE_PAY_ENABLED:false}
      appid: ${WECHAT_PAY_APPID:}
      mchid: ${WECHAT_PAY_MCHID:}
      merchant-serial-no: ${WECHAT_PAY_MERCHANT_SERIAL_NO:}
      merchant-private-key-path: ${WECHAT_PAY_MERCHANT_PRIVATE_KEY_PATH:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      wechat-pay-public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
      wechat-pay-public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
      notify-url: ${WECHAT_PAY_NOTIFY_URL:}
      api-base-url: ${WECHAT_PAY_API_BASE_URL:https://api.mch.weixin.qq.com}
    alipay-page:
      enabled: ${ALIPAY_PAGE_PAY_ENABLED:false}
      app-id: ${ALIPAY_APP_ID:}
      merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
      alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
      notify-url: ${ALIPAY_NOTIFY_URL:}
      return-url: ${ALIPAY_RETURN_URL:}
      gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
      pay-mode: ${ALIPAY_PAY_MODE:PAGE}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  model-vendor-balance:
    scheduled-enabled: ${MODEL_VENDOR_BALANCE_SCHEDULED:false}
    scheduled-interval-ms: ${MODEL_VENDOR_BALANCE_SCHEDULED_INTERVAL_MS:600000}

ppt:
  engine:
    # macOS 上 5000 常被 AirPlay Receiver 占用并返回 403；本机 Docker 引擎映射为 5001
    base-url: ${PPT_ENGINE_BASE_URL:http://127.0.0.1:5001}
    connect-timeout-ms: ${PPT_ENGINE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${PPT_ENGINE_READ_TIMEOUT_MS:300000}
  billing:
    create-project-credits: ${PPT_BILLING_CREATE:5}
    generate-outline-credits: ${PPT_BILLING_OUTLINE:10}
    generate-descriptions-credits: ${PPT_BILLING_DESCRIPTIONS:20}
    generate-images-credits: ${PPT_BILLING_IMAGES:50}
    export-pptx-credits: ${PPT_BILLING_EXPORT_PPTX:5}
    export-pdf-credits: ${PPT_BILLING_EXPORT_PDF:5}
    export-editable-pptx-credits: ${PPT_BILLING_EXPORT_EDITABLE_PPTX:15}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
