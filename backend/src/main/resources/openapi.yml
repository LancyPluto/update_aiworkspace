openapi: 3.0.3
info:
  title: AI 超市平台 V1 当前接口文档
  description: 当前 dev 分支已实现接口契约，仅包含可联调的真实接口。
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: 本地 Spring Boot 服务

tags:
  - name: 健康检查
    description: 服务健康检查和连通性测试接口
  - name: 用户认证
    description: 用户注册、登录、退出和当前用户信息接口
  - name: 管理员认证
    description: 管理员登录、退出和当前管理员信息接口
  - name: 工具超市
    description: 用户端工具分类、工具列表、任务和算力接口
  - name: 后台工具管理
    description: 管理后台工具最小管理接口
  - name: Worker内部接口
    description: AI Worker 获取任务上下文和回写任务结果的内部接口

paths:
  /api/health:
    get:
      tags:
        - 健康检查
      summary: 服务健康检查
      operationId: health
      responses:
        "200":
          description: 健康检查结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthApiResponse"

  /api/v1/ping:
    get:
      tags:
        - 健康检查
      summary: 用户端接口连通性测试
      operationId: userPing
      responses:
        "200":
          description: pong 连通性响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringApiResponse"

  /api/admin/v1/ping:
    get:
      tags:
        - 健康检查
      summary: 管理端接口连通性测试
      operationId: adminPing
      responses:
        "200":
          description: pong 连通性响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringApiResponse"

  /api/v1/auth/register:
    post:
      tags:
        - 用户认证
      summary: 普通用户注册
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: test001
              password: "123456"
              nickname: 测试用户
      responses:
        "200":
          description: 注册成功并返回登录态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/login:
    post:
      tags:
        - 用户认证
      summary: 普通用户登录
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              account: user1
              password: "123456"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/logout:
    post:
      tags:
        - 用户认证
      summary: 普通用户退出登录
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 退出登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me:
    get:
      tags:
        - 用户认证
      summary: 获取当前用户信息
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/v1/auth/login:
    post:
      tags:
        - 管理员认证
      summary: 管理员登录
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              account: admin
              password: "123456"
      responses:
        "200":
          description: 管理员登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/admin/v1/auth/me:
    get:
      tags:
        - 管理员认证
      summary: 获取当前管理员信息
      operationId: getCurrentAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前管理员信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/auth/logout:
    post:
      tags:
        - 管理员认证
      summary: 管理员退出登录
      operationId: logoutAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 退出登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tool-categories:
    get:
      tags:
        - 工具超市
      summary: 获取启用的工具分类列表
      operationId: listToolCategories
      responses:
        "200":
          description: 启用分类列表，按 sortOrder 和 id 升序返回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCategoryListApiResponse"

  /api/v1/tools:
    get:
      tags:
        - 工具超市
      summary: 获取已上线工具列表
      operationId: listUserTools
      responses:
        "200":
          description: 已上线工具列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"

  /api/v1/tools/{toolCode}:
    get:
      tags:
        - 工具超市
      summary: 获取工具详情和动态表单字段
      operationId: getUserToolDetail
      parameters:
        - name: toolCode
          in: path
          required: true
          schema:
            type: string
          example: xiaohongshu_copywriting
      responses:
        "200":
          description: 已上线工具详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDetailApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/credits/account:
    get:
      tags:
        - 用户认证
      summary: 获取当前用户算力账户
      operationId: getCreditAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户算力账户，新用户默认 100 点算力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccountApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tasks:
    post:
      tags:
        - 工具超市
      summary: 创建 AI 任务
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
            example:
              toolCode: xiaohongshu_copywriting
              params:
                productName: 测试产品
                targetCustomer: 年轻用户
                style: 种草
              clientRequestId: uuid-from-frontend
      responses:
        "200":
          description: 任务创建成功并进入队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags:
        - 工具超市
      summary: 获取当前用户任务列表
      operationId: listTasks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户的任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPageApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tasks/{taskId}/status:
    get:
      tags:
        - 工具超市
      summary: 查询任务状态
      operationId: getTaskStatus
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tasks/{taskId}:
    get:
      tags:
        - 工具超市
      summary: 查询任务详情
      operationId: getTaskDetail
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/v1/tools:
    get:
      tags:
        - 后台工具管理
      summary: 后台获取工具列表
      operationId: listAdminTools
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 后台工具列表，包含草稿、已上线、已下架工具
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - 后台工具管理
      summary: 后台新增草稿工具
      operationId: createAdminTool
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertToolRequest"
            example:
              toolCode: xiaohongshu_copywriting
              toolName: 小红书文案生成
              categoryId: 1
              description: 根据产品信息生成小红书文案
              coverUrl: ""
              estimatedCreditCost: 10
      responses:
        "200":
          description: 草稿工具创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/tools/{toolId}:
    put:
      tags:
        - 后台工具管理
      summary: 后台编辑工具基础信息
      operationId: updateAdminTool
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToolRequest"
            example:
              toolName: 小红书文案生成 Pro
              categoryId: 1
              description: 根据产品信息生成更完整的小红书文案
              coverUrl: ""
              estimatedCreditCost: 12
      responses:
        "200":
          description: 工具更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/tools/{toolId}/publish:
    post:
      tags:
        - 后台工具管理
      summary: 后台发布工具
      operationId: publishAdminTool
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 工具状态已变更为 ONLINE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/tools/{toolId}/offline:
    post:
      tags:
        - 后台工具管理
      summary: 后台下架工具
      operationId: offlineAdminTool
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 工具状态已变更为 OFFLINE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/internal/v1/tasks/{taskId}/execution-context:
    get:
      tags:
        - Worker内部接口
      summary: Worker 获取任务执行上下文
      operationId: getTaskExecutionContext
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 任务执行上下文，包含用户参数和当前生效字段配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionContextApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/internal/v1/tasks/{taskId}/processing:
    post:
      tags:
        - Worker内部接口
      summary: Worker 标记任务处理中
      operationId: markTaskProcessing
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerProcessingRequest"
            example:
              progress: 35
              progressMessage: AI 正在生成内容
      responses:
        "200":
          description: 任务状态已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/internal/v1/tasks/{taskId}/success:
    post:
      tags:
        - Worker内部接口
      summary: Worker 回写成功结果
      operationId: markTaskSuccess
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerSuccessRequest"
            example:
              resourceType: MARKDOWN
              contentText: "# 生成结果"
      responses:
        "200":
          description: 任务状态 changed to SUCCESS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/internal/v1/tasks/{taskId}/failed:
    post:
      tags:
        - Worker内部接口
      summary: Worker 回写失败状态
      operationId: markTaskFailed
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerFailedRequest"
            example:
              errorCode: MODEL_CALL_FAILED
              errorMessage: 模型调用超时
      responses:
        "200":
          description: 任务状态 changed to FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 业务错误或参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"
          example:
            code: PARAM_ERROR
            message: 参数错误
            data: null
            requestId: null
    Unauthorized:
      description: 未登录或 Token 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"
          example:
            code: UNAUTHORIZED
            message: 未登录或 Token 失效
            data: null
            requestId: null
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"
          example:
            code: ADMIN_FORBIDDEN
            message: 管理员无权限
            data: null
            requestId: null

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 唯一用户名。
          example: test001
        password:
          type: string
          minLength: 6
          maxLength: 64
          example: "123456"
        nickname:
          type: string
          nullable: true
          description: 可选昵称，不传或为空时默认使用用户名。
          example: 测试用户

    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          description: 用户名。
          example: user1
        password:
          type: string
          example: "123456"

    UpsertToolRequest:
      type: object
      required:
        - toolCode
        - toolName
        - categoryId
        - estimatedCreditCost
      properties:
        toolCode:
          type: string
          description: 工具唯一编码，新增工具时必填。
          example: xiaohongshu_copywriting
        toolName:
          type: string
          example: 小红书文案生成
        categoryId:
          type: integer
          format: int64
          example: 1
        description:
          type: string
          nullable: true
          example: 根据产品信息生成小红书文案
        coverUrl:
          type: string
          nullable: true
          example: ""
        estimatedCreditCost:
          type: integer
          minimum: 0
          example: 10

    UpdateToolRequest:
      type: object
      required:
        - toolName
        - categoryId
        - estimatedCreditCost
      properties:
        toolCode:
          type: string
          nullable: true
          description: 当前编辑接口会忽略该字段。
        toolName:
          type: string
          example: 小红书文案生成 Pro
        categoryId:
          type: integer
          format: int64
          example: 1
        description:
          type: string
          nullable: true
          example: 根据产品信息生成更完整的小红书文案
        coverUrl:
          type: string
          nullable: true
          example: ""
        estimatedCreditCost:
          type: integer
          minimum: 0
          example: 12

    ApiResponseBase:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - SUCCESS
            - PARAM_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - ADMIN_UNAUTHORIZED
            - ADMIN_FORBIDDEN
            - TOOL_NOT_FOUND
            - TOOL_OFFLINE
            - CREDIT_NOT_ENOUGH
            - TASK_NOT_FOUND
            - TASK_STATUS_INVALID
            - MODEL_CALL_FAILED
            - SYSTEM_ERROR
          example: SUCCESS
        message:
          type: string
          example: ok
        requestId:
          type: string
          nullable: true
          example: null

    EmptyApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              nullable: true
              example: null

    StringApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: string
              example: pong

    HealthApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthStatus"

    HealthStatus:
      type: object
      properties:
        service:
          type: string
          example: backend
        mysql:
          type: string
          example: ok
        redis:
          type: string
          example: ok

    LoginApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/LoginResponse"

    UserProfileApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UserProfile"

    ToolCategoryListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ToolCategory"

    ToolPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ToolPage"

    ToolSummaryApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ToolSummary"

    ToolDetailApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ToolDetail"

    CreditAccountApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CreditAccount"

    TaskStatusApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskStatus"

    TaskDetailApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskDetail"

    TaskPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskPage"

    ExecutionContextApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ExecutionContext"

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT 访问令牌。
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: user1
        nickname:
          type: string
          example: 用户一
        userType:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER

    ToolCategory:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        categoryCode:
          type: string
          example: copywriting
        categoryName:
          type: string
          example: 文案生成
        sortOrder:
          type: integer
          example: 1

    ToolPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/ToolSummary"
        total:
          type: integer
          format: int64
          example: 1

    ToolSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        toolCode:
          type: string
          example: xiaohongshu_copywriting
        toolName:
          type: string
          example: 小红书文案生成
        categoryId:
          type: integer
          format: int64
          example: 1
        categoryName:
          type: string
          example: 文案生成
        description:
          type: string
          nullable: true
          example: 根据产品信息生成小红书文案
        coverUrl:
          type: string
          nullable: true
          example: ""
        status:
          type: string
          enum:
            - DRAFT
            - ONLINE
            - OFFLINE
          example: ONLINE
        estimatedCreditCost:
          type: integer
          example: 10

    ToolDetail:
      allOf:
        - $ref: "#/components/schemas/ToolSummary"
        - type: object
          properties:
            fields:
              type: array
              items:
                $ref: "#/components/schemas/ToolField"

    ToolField:
      type: object
      properties:
        fieldKey:
          type: string
          example: productName
        fieldName:
          type: string
          example: 产品名称
        fieldType:
          type: string
          enum:
            - text
            - textarea
            - select
          example: text
        placeholder:
          type: string
          nullable: true
          example: 请输入产品名称
        options:
          nullable: true
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/ToolFieldOption"
            - type: object
        required:
          type: boolean
          example: true
        sortOrder:
          type: integer
          example: 1

    ToolFieldOption:
      type: object
      properties:
        label:
          type: string
          example: 种草
        value:
          type: string
          example: 种草

    CreditAccount:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 2
        balance:
          type: integer
          example: 100
        frozen:
          type: integer
          example: 0
        totalGranted:
          type: integer
          example: 100
        totalConsumed:
          type: integer
          example: 0
        status:
          type: string
          example: ACTIVE

    CreateTaskRequest:
      type: object
      required:
        - toolCode
        - params
      properties:
        toolCode:
          type: string
          example: xiaohongshu_copywriting
        params:
          type: object
          additionalProperties: true
          example:
            productName: 测试产品
            targetCustomer: 年轻用户
            style: 种草
        clientRequestId:
          type: string
          nullable: true
          example: uuid-from-frontend

    TaskStatus:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
          example: 1
        taskNo:
          type: string
          example: T20260508AF040D708A
        status:
          type: string
          enum:
            - CREATED
            - QUEUED
            - PROCESSING
            - RETRYING
            - SUCCESS
            - FAILED
            - TIMEOUT
            - CANCELLED
          example: QUEUED
        progress:
          type: integer
          example: 0
        progressMessage:
          type: string
          example: 任务已排队

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskStatus"
        - type: object
          properties:
            toolCode:
              type: string
              example: xiaohongshu_copywriting
            toolName:
              type: string
              example: 小红书文案生成
            params:
              type: object
              additionalProperties: true
            result:
              nullable: true
              $ref: "#/components/schemas/TaskResult"
            createdAt:
              type: string
              format: date-time
            finishedAt:
              type: string
              format: date-time
              nullable: true

    TaskResult:
      type: object
      properties:
        resourceType:
          type: string
          example: MARKDOWN
        contentText:
          type: string
          example: 生成内容

    TaskPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/TaskDetail"
        total:
          type: integer
          format: int64
          example: 1

    ExecutionContext:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
          example: 1
        taskNo:
          type: string
          example: T20260508AF040D708A
        userId:
          type: integer
          format: int64
          example: 2
        toolId:
          type: integer
          format: int64
          example: 1
        toolCode:
          type: string
          example: xiaohongshu_copywriting
        toolName:
          type: string
          example: 小红书文案生成
        status:
          type: string
          example: QUEUED
        params:
          type: object
          additionalProperties: true
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ToolField"

    WorkerProcessingRequest:
      type: object
      properties:
        progress:
          type: integer
          minimum: 0
          maximum: 99
          example: 35
        progressMessage:
          type: string
          example: AI 正在生成内容

    WorkerSuccessRequest:
      type: object
      required:
        - resourceType
        - contentText
      properties:
        resourceType:
          type: string
          example: MARKDOWN
        contentText:
          type: string
          example: "# Generated result"

    WorkerFailedRequest:
      type: object
      properties:
        errorCode:
          type: string
          example: MODEL_CALL_FAILED
        errorMessage:
          type: string
          example: 模型调用超时
