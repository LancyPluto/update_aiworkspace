spring:
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  datasource:
    url: jdbc:h2:mem:backend_test_default;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      connection-init-sql:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-test.sql

app:
  production-mode: false
  cache:
    enabled: false
  jwt-secret: local-dev-secret
  internal-api-token: local-internal-token
  workflow:
    confirmation:
      hmac-secret: test-workflow-confirmation-secret-with-at-least-32-characters
      ttl-minutes: 30
  ai-task-queue: ai:task:queue
  task-queue-backend: redis
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
