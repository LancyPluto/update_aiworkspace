      name: toolCode
      in: path
      required: true
      schema:
        type: string
    ToolCodeQuery:
      name: toolCode
      in: query
      required: false
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TaskStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [CREATED, QUEUED, PROCESSING, RETRYING, SUCCESS, FAILED, TIMEOUT, CANCELLED]
    LogType:
      name: logType
      in: query
      required: false
      schema:
        type: string
        enum: [FREEZE, DEDUCT, RELEASE, MANUAL_ADD, MANUAL_DEDUCT]

  responses:
    BadRequest:
      description: 业务错误或参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"
    Unauthorized:
      description: 未登录或令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"

