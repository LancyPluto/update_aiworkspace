openapi: 3.0.3
info:
  title: AI 工具市场 V1 API
  description: 当前后端实现的 V1 接口契约，供用户端、管理端、Worker 和测试联调统一使用。
  version: 0.2.0
servers:
  - url: http://localhost:8080
    description: 本地 Spring Boot 服务

tags:
  - name: 健康检查
  - name: 用户认证
  - name: 管理员认证
  - name: 工具市场
  - name: 用户任务
  - name: 算力账户
  - name: 后台工具管理
  - name: 后台任务管理
  - name: 后台用户管理
  - name: 后台 Agent 模型配置
  - name: 后台计费管理
  - name: Worker 内部接口

paths:
  /api/health:
    get:
      tags: [健康检查]
      summary: 服务健康检查
      operationId: health
      responses:
        "200":
          description: 健康检查结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthApiResponse"

  /api/v1/ping:
    get:
      tags: [健康检查]
      summary: 用户端接口连通性测试
      operationId: userPing
      responses:
        "200":
          description: pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringApiResponse"

  /api/admin/v1/ping:
    get:
      tags: [健康检查]
      summary: 管理端接口连通性测试
      operationId: adminPing
      responses:
        "200":
          description: pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringApiResponse"

  /api/v1/auth/register:
    post:
      tags: [用户认证]
      summary: 普通用户注册
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功并返回登录态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/login:
    post:
      tags: [用户认证]
      summary: 普通用户登录
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/logout:
    post:
      tags: [用户认证]
      summary: 普通用户退出登录
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me:
    get:
      tags: [用户认证]
      summary: 获取当前用户信息
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/v1/auth/login:
    post:
      tags: [管理员认证]
      summary: 管理员登录
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/admin/v1/auth/logout:
    post:
      tags: [管理员认证]
      summary: 管理员退出登录
      operationId: logoutAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"

  /api/admin/v1/auth/me:
    get:
      tags: [管理员认证]
      summary: 获取当前管理员信息
      operationId: getCurrentAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前管理员信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileApiResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/tool-categories:
    get:
      tags: [工具市场]
      summary: 获取启用的工具分类列表
      operationId: listToolCategories
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCategoryListApiResponse"

  /api/v1/tools:
    get:
      tags: [工具市场]
      summary: 获取已上线工具列表
      operationId: listUserTools
      parameters:
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 已上线工具分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"

  /api/v1/tools/search:
    get:
      tags: [工具市场]
      summary: 搜索已上线工具
      operationId: searchUserTools
      parameters:
        - $ref: "#/components/parameters/RequiredKeyword"
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"

  /api/v1/tools/{toolCode}:
    get:
      tags: [工具市场]
      summary: 获取工具详情和动态字段配置
      operationId: getUserToolDetail
      parameters:
        - $ref: "#/components/parameters/ToolCode"
      responses:
        "200":
          description: 工具详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDetailApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/tasks:
    post:
      tags: [用户任务]
      summary: 创建 AI 任务
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "200":
          description: 任务创建成功，算力进入冻结状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [用户任务]
      summary: 获取当前用户任务列表
      operationId: listUserTasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskStatusQuery"
        - $ref: "#/components/parameters/ToolCodeQuery"
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 当前用户任务分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPageApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tasks/{taskId}:
    get:
      tags: [用户任务]
      summary: 获取任务详情和结果
      operationId: getTaskDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailApiResponse"

  /api/v1/tasks/{taskId}/status:
    get:
      tags: [用户任务]
      summary: 查询任务状态
      operationId: getTaskStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/v1/tasks/{taskId}/cancel:
    post:
      tags: [用户任务]
      summary: 用户取消任务
      operationId: cancelUserTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 取消成功，冻结算力释放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/v1/tasks/{taskId}/regenerate:
    post:
      tags: [用户任务]
      summary: 基于历史任务重新生成
      operationId: regenerateTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateTaskRequest"
      responses:
        "200":
          description: 新任务创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/v1/credits/account:
    get:
      tags: [算力账户]
      summary: 获取当前用户算力账户
      operationId: getCreditAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户算力账户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccountApiResponse"

  /api/v1/credits/logs:
    get:
      tags: [算力账户]
      summary: 获取当前用户算力流水
      operationId: listCreditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LogType"
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 算力流水分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLogPageApiResponse"

  /api/admin/v1/tools:
    get:
      tags: [后台工具管理]
      summary: 后台查询工具列表
      operationId: listAdminTools
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/CategoryId"
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ONLINE, OFFLINE]
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 后台工具分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"
    post:
      tags: [后台工具管理]
      summary: 新增工具草稿
      operationId: createAdminTool
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertToolRequest"
      responses:
        "200":
          description: 工具创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"

  /api/admin/v1/tools/{toolId}:
    get:
      tags: [后台工具管理]
      summary: 获取后台工具详情
      operationId: getAdminToolDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ToolId"
      responses:
        "200":
          description: 工具详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDetailApiResponse"
    put:
      tags: [后台工具管理]
      summary: 编辑工具基础信息
      operationId: updateAdminTool
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ToolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToolRequest"
      responses:
        "200":
          description: 工具更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"

  /api/admin/v1/tools/{toolId}/fields:
    get:
      tags: [后台工具管理]
      summary: 获取工具字段配置
      operationId: getAdminToolFields
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ToolId"
      responses:
        "200":
          description: 当前字段配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolFieldListApiResponse"
    put:
      tags: [后台工具管理]
      summary: 覆盖工具字段配置
      operationId: updateAdminToolFields
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ToolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToolFieldsRequest"
      responses:
        "200":
          description: 字段配置更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolFieldListApiResponse"

  /api/admin/v1/tools/{toolId}/publish:
    post:
      tags: [后台工具管理]
      summary: 发布工具
      operationId: publishAdminTool
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ToolId"
      responses:
        "200":
          description: 工具状态变为 ONLINE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"

  /api/admin/v1/tools/{toolId}/offline:
    post:
      tags: [后台工具管理]
      summary: 下架工具
      operationId: offlineAdminTool
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ToolId"
      responses:
        "200":
          description: 工具状态变为 OFFLINE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"

  /api/admin/v1/tasks:
    get:
      tags: [后台任务管理]
      summary: 后台查询任务列表
      operationId: listAdminTasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskStatusQuery"
        - $ref: "#/components/parameters/ToolCodeQuery"
        - name: userId
          in: query
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 后台任务分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPageApiResponse"

  /api/admin/v1/tasks/{taskId}:
    get:
      tags: [后台任务管理]
      summary: 后台查询任务详情
      operationId: getAdminTaskDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailApiResponse"

  /api/admin/v1/tasks/{taskId}/retry:
    post:
      tags: [后台任务管理]
      summary: 后台重试任务
      operationId: retryAdminTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务重新进入 QUEUED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/admin/v1/tasks/{taskId}/cancel:
    post:
      tags: [后台任务管理]
      summary: 后台取消任务
      operationId: cancelAdminTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务变为 CANCELLED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/admin/v1/users:
    get:
      tags: [后台用户管理]
      summary: 后台查询用户列表
      operationId: listAdminUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Keyword"
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, DISABLED]
        - name: userType
          in: query
          schema:
            type: string
            enum: [USER, ADMIN]
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 用户分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPageApiResponse"

  /api/admin/v1/users/{userId}:
    get:
      tags: [后台用户管理]
      summary: 后台查询用户详情
      operationId: getAdminUserDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserApiResponse"

  /api/admin/v1/users/{userId}/status:
    patch:
      tags: [后台用户管理]
      summary: 启用或禁用用户
      operationId: updateAdminUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: 用户状态更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserApiResponse"

  /api/admin/v1/users/{userId}/credits/account:
    get:
      tags: [后台用户管理]
      summary: 查询指定用户算力账户
      operationId: getAdminUserCreditAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 算力账户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccountApiResponse"

  /api/admin/v1/users/{userId}/credits/logs:
    get:
      tags: [后台用户管理]
      summary: 查询指定用户算力流水
      operationId: listAdminUserCreditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/LogType"
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 算力流水
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLogPageApiResponse"

  /api/admin/v1/users/{userId}/credits/manual-add:
    post:
      tags: [后台用户管理]
      summary: 后台手动增加算力
      operationId: manualAddCredit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualCreditRequest"
      responses:
        "200":
          description: 增加后的算力账户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccountApiResponse"

  /api/admin/v1/users/{userId}/credits/manual-deduct:
    post:
      tags: [后台用户管理]
      summary: 后台手动扣减算力
      operationId: manualDeductCredit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualCreditRequest"
      responses:
        "200":
          description: 扣减后的算力账户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccountApiResponse"

  /api/admin/v1/agent/model-config:
    get:
      tags: [后台 Agent 模型配置]
      summary: 获取默认 Agent 模型配置
      operationId: getAdminAgentModelConfig
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 默认模型配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentModelConfigApiResponse"
    put:
      tags: [后台 Agent 模型配置]
      summary: 保存默认 Agent 模型配置
      operationId: saveAdminAgentModelConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentModelConfigRequest"
      responses:
        "200":
          description: 保存后的模型配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentModelConfigApiResponse"
    post:
      tags: [后台 Agent 模型配置]
      summary: 新增 Agent 模型配置
      operationId: createAdminAgentModelConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentModelConfigRequest"
      responses:
        "200":
          description: 新增后的模型配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentModelConfigApiResponse"

  /api/admin/v1/agent/model-config/list:
    get:
      tags: [后台 Agent 模型配置]
      summary: 查询 Agent 模型配置列表
      operationId: listAdminAgentModelConfigs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 模型配置列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentModelConfigListApiResponse"

  /api/admin/v1/agent/model-config/{id}:
    put:
      tags: [后台 Agent 模型配置]
      summary: 更新 Agent 模型配置
      operationId: updateAdminAgentModelConfig
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentModelConfigRequest"
      responses:
        "200":
          description: 更新后的模型配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentModelConfigApiResponse"
    delete:
      tags: [后台 Agent 模型配置]
      summary: 删除 Agent 模型配置
      operationId: deleteAdminAgentModelConfig
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"

  /api/admin/v1/agent/model-config/{id}/default:
    post:
      tags: [后台 Agent 模型配置]
      summary: 设置默认 Agent 模型配置
      operationId: setDefaultAdminAgentModelConfig
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 设置默认后的模型配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentModelConfigApiResponse"

  /api/admin/v1/agent/model-config/test:
    post:
      tags: [后台 Agent 模型配置]
      summary: 测试 Agent 模型配置连通性
      operationId: testAdminAgentModelConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentModelConfigRequest"
      responses:
        "200":
          description: 连通性测试结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentModelConfigTestApiResponse"

  /api/admin/v1/billing/overview:
    get:
      tags: [后台计费管理]
      summary: 查询今日 token 使用与模型成本概览
      operationId: getAdminBillingOverview
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 今日计费概览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingOverviewApiResponse"

  /api/admin/v1/billing/usage-logs:
    get:
      tags: [后台计费管理]
      summary: 查询模型计费日志分页
      operationId: listAdminBillingUsageLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 计费日志分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUsageLogPageApiResponse"

  /api/internal/v1/tasks/{taskId}/execution-context:
    get:
      tags: [Worker 内部接口]
      summary: Worker 获取任务执行上下文
      operationId: getTaskExecutionContext
      security:
        - internalApiToken: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 执行上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionContextApiResponse"

  /api/internal/v1/tasks/{taskId}/processing:
    post:
      tags: [Worker 内部接口]
      summary: Worker 回写处理中进度
      operationId: markTaskProcessing
      security:
        - internalApiToken: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerProcessingRequest"
      responses:
        "200":
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/internal/v1/tasks/{taskId}/success:
    post:
      tags: [Worker 内部接口]
      summary: Worker 回写成功结果
      operationId: markTaskSuccess
      security:
        - internalApiToken: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerSuccessRequest"
      responses:
        "200":
          description: 任务成功，冻结算力转为扣除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/internal/v1/tasks/{taskId}/failed:
    post:
      tags: [Worker 内部接口]
      summary: Worker 回写失败结果
      operationId: markTaskFailed
      security:
        - internalApiToken: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerFailedRequest"
      responses:
        "200":
          description: 任务失败，冻结算力释放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Worker 内部接口令牌，本地默认 local-internal-token。

  parameters:
    Keyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
    RequiredKeyword:
      name: keyword
      in: query
      required: true
      schema:
        type: string
    PageNo:
      name: pageNo
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CategoryId:
      name: categoryId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    ToolId:
      name: toolId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ToolCode:
      name: toolCode
      in: path
      required: true
      schema:
        type: string
    ToolCodeQuery:
      name: toolCode
      in: query
      required: false
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TaskStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [CREATED, QUEUED, PROCESSING, RETRYING, SUCCESS, FAILED, TIMEOUT, CANCELLED]
    LogType:
      name: logType
      in: query
      required: false
      schema:
        type: string
        enum: [FREEZE, DEDUCT, RELEASE, MANUAL_ADD, MANUAL_DEDUCT]

  responses:
    BadRequest:
      description: 业务错误或参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"
    Unauthorized:
      description: 未登录或令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"

  schemas:
    ApiResponseBase:
      type: object
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: ok
        requestId:
          type: string
          nullable: true

    EmptyApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              nullable: true

    StringApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: string
              example: pong

    HealthApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthStatus"

    LoginApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/LoginResponse"

    UserProfileApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UserProfile"

    ToolCategoryListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ToolCategory"

    ToolPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PageToolSummary"

    ToolSummaryApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ToolSummary"

    ToolDetailApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ToolDetail"

    ToolFieldListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ToolField"

    CreditAccountApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CreditAccount"

    CreditLogPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PageCreditLog"

    TaskStatusApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskStatus"

    TaskDetailApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskDetail"

    TaskPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PageTaskDetail"

    AdminUserApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminUser"

    AdminUserPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PageAdminUser"

    ExecutionContextApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ExecutionContext"

    AgentModelConfigApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AgentModelConfig"

    AgentModelConfigListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/AgentModelConfig"

    AgentModelConfigTestApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AgentModelConfigTestResult"

    BillingOverviewApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BillingOverview"

    BillingUsageLogPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PageBillingUsageLog"

    HealthStatus:
      type: object
      properties:
        service:
          type: string
        mysql:
          type: string
        redis:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: test001
        password:
          type: string
          minLength: 6
          maxLength: 64
          example: "123456"
        nickname:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account:
          type: string
          example: user1
        password:
          type: string
          example: "123456"

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        userType:
          type: string
          enum: [USER, ADMIN]

    AdminUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        nickname:
          type: string
        userType:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        creditAccount:
          $ref: "#/components/schemas/CreditAccount"

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        reason:
          type: string
          nullable: true

    UpsertToolRequest:
      type: object
      required: [toolCode, toolName, categoryId, estimatedCreditCost]
      properties:
        toolCode:
          type: string
        toolName:
          type: string
        categoryId:
          type: integer
          format: int64
        description:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
        estimatedCreditCost:
          type: integer
          minimum: 0

    UpdateToolRequest:
      type: object
      required: [toolName, categoryId, estimatedCreditCost]
      properties:
        toolCode:
          type: string
          nullable: true
          description: 更新接口会忽略该字段。
        toolName:
          type: string
        categoryId:
          type: integer
          format: int64
        description:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
        estimatedCreditCost:
          type: integer
          minimum: 0

    UpdateToolFieldsRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ToolFieldInput"

    ToolFieldInput:
      type: object
      required: [fieldKey, fieldName, fieldType]
      properties:
        fieldKey:
          type: string
        fieldName:
          type: string
        fieldType:
          type: string
          enum: [text, textarea, select]
        placeholder:
          type: string
          nullable: true
        options:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ToolFieldOption"
        required:
          type: boolean
        sortOrder:
          type: integer

    ToolCategory:
      type: object
      properties:
        id:
          type: integer
          format: int64
        categoryCode:
          type: string
        categoryName:
          type: string
        sortOrder:
          type: integer

    ToolSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        toolCode:
          type: string
        toolName:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        description:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, ONLINE, OFFLINE]
        estimatedCreditCost:
          type: integer

    ToolDetail:
      allOf:
        - $ref: "#/components/schemas/ToolSummary"
        - type: object
          properties:
            fields:
              type: array
              items:
                $ref: "#/components/schemas/ToolField"

    ToolField:
      type: object
      properties:
        fieldKey:
          type: string
        fieldName:
          type: string
        fieldType:
          type: string
          enum: [text, textarea, select]
        placeholder:
          type: string
          nullable: true
        options:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ToolFieldOption"
        required:
          type: boolean
        sortOrder:
          type: integer

    ToolFieldOption:
      type: object
      properties:
        label:
          type: string
        value:
          type: string

    CreateTaskRequest:
      type: object
      required: [toolCode, params]
      properties:
        toolCode:
          type: string
        params:
          type: object
          additionalProperties: true
        clientRequestId:
          type: string
          nullable: true

    RegenerateTaskRequest:
      type: object
      required: [params]
      properties:
        params:
          type: object
          additionalProperties: true
        clientRequestId:
          type: string
          nullable: true

    TaskStatus:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        taskNo:
          type: string
        status:
          type: string
          enum: [CREATED, QUEUED, PROCESSING, RETRYING, SUCCESS, FAILED, TIMEOUT, CANCELLED]
        progress:
          type: integer
        progressMessage:
          type: string

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskStatus"
        - type: object
          properties:
            userId:
              type: integer
              format: int64
            toolCode:
              type: string
            toolName:
              type: string
            params:
              type: object
              additionalProperties: true
            result:
              nullable: true
              $ref: "#/components/schemas/TaskResult"
            createdAt:
              type: string
              format: date-time
            finishedAt:
              type: string
              format: date-time
              nullable: true

    TaskResult:
      type: object
      properties:
        resourceType:
          type: string
        contentText:
          type: string

    CreditAccount:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        balance:
          type: integer
        frozen:
          type: integer
        available:
          type: integer
        totalGranted:
          type: integer
        totalConsumed:
          type: integer
        status:
          type: string
          enum: [ACTIVE]

    CreditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
          nullable: true
        logType:
          type: string
          enum: [FREEZE, DEDUCT, RELEASE, MANUAL_ADD, MANUAL_DEDUCT]
        amount:
          type: integer
        frozenAmount:
          type: integer
        balanceBefore:
          type: integer
        balanceAfter:
          type: integer
        frozenBefore:
          type: integer
        frozenAfter:
          type: integer
        operatorType:
          type: string
        operatorId:
          type: integer
          format: int64
          nullable: true
        reason:
          type: string
        createdAt:
          type: string
          format: date-time

    ManualCreditRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1
        reason:
          type: string
          nullable: true

    ExecutionContext:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        taskNo:
          type: string
        userId:
          type: integer
          format: int64
        toolId:
          type: integer
          format: int64
        toolCode:
          type: string
        toolName:
          type: string
        status:
          type: string
        params:
          type: object
          additionalProperties: true
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ToolField"

    AgentModelConfigRequest:
      type: object
      required: [provider, modelName]
      properties:
        displayName:
          type: string
          nullable: true
        configCode:
          type: string
          nullable: true
        provider:
          type: string
          example: openai
        modelName:
          type: string
          example: gpt-image-1
        baseUrl:
          type: string
          nullable: true
        apiKey:
          type: string
          nullable: true
        minimaxGroupId:
          type: string
          nullable: true
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 300
          nullable: true
        inputTokenPricePer1k:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: 输入 token 每 1k 成本单价，用于后台成本看板。
        outputTokenPricePer1k:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: 输出 token 每 1k 成本单价，用于后台成本看板。
        enabled:
          type: boolean
          nullable: true
        isDefault:
          type: boolean
          nullable: true

    AgentModelConfig:
      type: object
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
        configCode:
          type: string
        provider:
          type: string
        modelName:
          type: string
        baseUrl:
          type: string
          nullable: true
        apiKeyMasked:
          type: string
          description: 脱敏后的 API Key，不返回明文。
        minimaxGroupId:
          type: string
          nullable: true
        timeoutSeconds:
          type: integer
        inputTokenPricePer1k:
          type: number
          format: double
        outputTokenPricePer1k:
          type: number
          format: double
        enabled:
          type: boolean
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentModelConfigTestResult:
      type: object
      properties:
        success:
          type: boolean
        provider:
          type: string
        modelName:
          type: string
        latencyMs:
          type: integer
          format: int64
          nullable: true
        message:
          type: string
        sample:
          type: string
          nullable: true

    BillingOverview:
      type: object
      properties:
        todayPromptTokens:
          type: integer
          format: int64
        todayCompletionTokens:
          type: integer
          format: int64
        todayTotalTokens:
          type: integer
          format: int64
        todayCostAmount:
          type: number
          format: double
        todayChargedCredits:
          type: integer
          format: int64
        todayUsageCount:
          type: integer
          format: int64
        modelCosts:
          type: array
          items:
            $ref: "#/components/schemas/BillingModelCostPoint"

    BillingModelCostPoint:
      type: object
      properties:
        provider:
          type: string
        modelName:
          type: string
        totalTokens:
          type: integer
          format: int64
        costAmount:
          type: number
          format: double
        chargedCredits:
          type: integer
          format: int64

    BillingUsageLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sourceType:
          type: string
          enum: [TASK, AGENT_RUN]
        sourceId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        modelConfigId:
          type: integer
          format: int64
          nullable: true
        provider:
          type: string
        modelName:
          type: string
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        totalTokens:
          type: integer
        inputTokenPricePer1k:
          type: number
          format: double
        outputTokenPricePer1k:
          type: number
          format: double
        costAmount:
          type: number
          format: double
        chargedCredits:
          type: integer
        createdAt:
          type: string
          format: date-time

    WorkerProcessingRequest:
      type: object
      properties:
        progress:
          type: integer
          minimum: 0
          maximum: 99
        progressMessage:
          type: string

    WorkerSuccessRequest:
      type: object
      required: [resourceType, contentText]
      properties:
        resourceType:
          type: string
          example: MARKDOWN
        contentText:
          type: string
        promptTokens:
          type: integer
          minimum: 0
          nullable: true
          description: Worker 实际使用的输入 token 数；传入后后台会写入 billing_usage_logs。
        completionTokens:
          type: integer
          minimum: 0
          nullable: true
          description: Worker 实际使用的输出 token 数；传入后后台会按模型单价计算成本。

    WorkerFailedRequest:
      type: object
      properties:
        errorCode:
          type: string
        errorMessage:
          type: string

    PageToolSummary:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/ToolSummary"

    PageTaskDetail:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/TaskDetail"

    PageCreditLog:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/CreditLog"

    PageAdminUser:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/AdminUser"

    PageBillingUsageLog:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/BillingUsageLog"

    PageBase:
      type: object
      properties:
        total:
          type: integer
          format: int64
        pageNo:
          type: integer
        pageSize:
          type: integer
        hasNext:
          type: boolean
