openapi: 3.0.3
info:
  title: AI 超市平台 V1 当前接口文档
  description: 当前 dev 分支已实现接口契约，仅包含可联调的真实接口。
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: 本地 Spring Boot 服务

tags:
  - name: 健康检查
    description: 服务健康检查和连通性测试接口
  - name: 用户认证
    description: 用户注册、登录、退出和当前用户信息接口
  - name: 管理员认证
    description: 管理员登录、退出和当前管理员信息接口
  - name: 工具超市
    description: 用户端工具分类、工具列表、任务和算力接口
  - name: 后台工具管理
    description: 管理后台工具最小管理接口
  - name: 后台任务管理
    description: 管理员查询任务、重试失败任务、取消任务的最小管理接口
  - name: Worker内部接口
    description: AI Worker 获取任务上下文和回写任务结果的内部接口

paths:
  /api/health:
    get:
      tags:
        - 健康检查
      summary: 服务健康检查
      operationId: health
      responses:
        "200":
          description: 健康检查结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthApiResponse"

  /api/v1/ping:
    get:
      tags:
        - 健康检查
      summary: 用户端接口连通性测试
      operationId: userPing
      responses:
        "200":
          description: pong 连通性响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringApiResponse"

  /api/admin/v1/ping:
    get:
      tags:
        - 健康检查
      summary: 管理端接口连通性测试
      operationId: adminPing
      responses:
        "200":
          description: pong 连通性响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringApiResponse"

  /api/v1/auth/register:
    post:
      tags:
        - 用户认证
      summary: 普通用户注册
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: test001
              password: "123456"
              nickname: 测试用户
      responses:
        "200":
          description: 注册成功并返回登录态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/login:
    post:
      tags:
        - 用户认证
      summary: 普通用户登录
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              account: user1
              password: "123456"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/logout:
    post:
      tags:
        - 用户认证
      summary: 普通用户退出登录
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 退出登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me:
    get:
      tags:
        - 用户认证
      summary: 获取当前用户信息
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/v1/auth/login:
    post:
      tags:
        - 管理员认证
      summary: 管理员登录
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              account: admin
              password: "123456"
      responses:
        "200":
          description: 管理员登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/admin/v1/auth/me:
    get:
      tags:
        - 管理员认证
      summary: 获取当前管理员信息
      operationId: getCurrentAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前管理员信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/auth/logout:
    post:
      tags:
        - 管理员认证
      summary: 管理员退出登录
      operationId: logoutAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 退出登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tool-categories:
    get:
      tags:
        - 工具超市
      summary: 获取启用的工具分类列表
      operationId: listToolCategories
      responses:
        "200":
          description: 启用分类列表，按 sortOrder 和 id 升序返回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCategoryListApiResponse"

  /api/v1/tools:
    get:
      tags:
        - 工具超市
      summary: 获取已上线工具列表
      operationId: listUserTools
      responses:
        "200":
          description: 已上线工具列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"

  /api/v1/tools/{toolCode}:
    get:
      tags:
        - 工具超市
      summary: 获取工具详情和动态表单字段
      operationId: getUserToolDetail
      parameters:
        - name: toolCode
          in: path
          required: true
          schema:
            type: string
          example: xiaohongshu_copywriting
      responses:
        "200":
          description: 已上线工具详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDetailApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/credits/account:
    get:
      tags:
        - 用户认证
      summary: 获取当前用户算力账户
      operationId: getCreditAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户算力账户，新用户默认 100 点算力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccountApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tasks:
    post:
      tags:
        - 工具超市
      summary: 创建 AI 任务
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
            example:
              toolCode: xiaohongshu_copywriting
              params:
                productName: 测试产品
                targetCustomer: 年轻用户
                style: 种草
              clientRequestId: uuid-from-frontend
      responses:
        "200":
          description: 任务创建成功并进入队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags:
        - 工具超市
      summary: 获取当前用户任务列表
      operationId: listTasks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户的任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPageApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tasks/{taskId}/status:
    get:
      tags:
        - 工具超市
      summary: 查询任务状态
      operationId: getTaskStatus
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tasks/{taskId}:
    get:
      tags:
        - 工具超市
      summary: 查询任务详情
      operationId: getTaskDetail
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/v1/tools:
    get:
      tags:
        - 后台工具管理
      summary: 后台获取工具列表
      operationId: listAdminTools
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 后台工具列表，包含草稿、已上线、已下架工具
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - 后台工具管理
      summary: 后台新增草稿工具
      operationId: createAdminTool
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertToolRequest"
            example:
              toolCode: xiaohongshu_copywriting
              toolName: 小红书文案生成
              categoryId: 1
              description: 根据产品信息生成小红书文案
              coverUrl: ""
              estimatedCreditCost: 10
      responses:
        "200":
          description: 草稿工具创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/tools/{toolId}:
    put:
      tags:
        - 后台工具管理
      summary: 后台编辑工具基础信息
      operationId: updateAdminTool
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToolRequest"
            example:
              toolName: 小红书文案生成 Pro
              categoryId: 1
              description: 根据产品信息生成更完整的小红书文案
              coverUrl: ""
              estimatedCreditCost: 12
      responses:
        "200":
          description: 工具更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/tools/{toolId}/field-schemas:
    get:
      tags:
        - 后台工具管理
      summary: 后台获取工具字段 Schema 列表
      operationId: listAdminToolFieldSchemas
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 工具字段 Schema 列表（含 DRAFT/ACTIVE）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldSchemaListApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - 后台工具管理
      summary: 后台创建字段 Schema 草稿
      operationId: createAdminToolFieldSchema
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFieldSchemaRequest"
            example:
              schemaVersion: v2
              fields:
                - fieldKey: brandName
                  fieldName: 品牌名称
                  fieldType: text
                  placeholder: 请输入品牌名称
                  required: true
                  sortOrder: 1
                - fieldKey: tone
                  fieldName: 语气
                  fieldType: select
                  placeholder: 请选择语气
                  optionsJson: '[{"label":"亲和","value":"friendly"},{"label":"专业","value":"professional"}]'
                  required: false
                  sortOrder: 2
      responses:
        "200":
          description: 字段 Schema 草稿创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldSchemaApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/field-schemas/{schemaId}/publish:
    post:
      tags:
        - 后台工具管理
      summary: 发布字段 Schema
      operationId: publishFieldSchema
      security:
        - bearerAuth: []
      parameters:
        - name: schemaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 11
      responses:
        "200":
          description: 字段 Schema 已发布为 ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldSchemaApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/tools/{toolId}/prompts:
    get:
      tags:
        - 后台工具管理
      summary: 获取工具 Prompt 列表
      operationId: listAdminToolPrompts
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 工具 Prompt 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptListApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - 后台工具管理
      summary: 创建 Prompt 草稿
      operationId: createAdminToolPrompt
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptRequest"
            example:
              promptCode: default
              promptName: 默认 Prompt
      responses:
        "200":
          description: Prompt 草稿创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/prompts/{promptId}/versions:
    get:
      tags:
        - 后台工具管理
      summary: 列出指定 Prompt 的全部版本（按 id 倒序）
      operationId: listPromptVersions
      security:
        - bearerAuth: []
      parameters:
        - name: promptId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 3
      responses:
        "200":
          description: Prompt 版本列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PromptVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - 后台工具管理
      summary: 新建 Prompt 版本草稿
      operationId: createPromptVersion
      security:
        - bearerAuth: []
      parameters:
        - name: promptId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptVersionRequest"
            example:
              versionNo: v1
              systemPrompt: 你是专业文案助手
              userPromptTemplate: |
                请根据输入参数生成内容：{{input}}
              outputFormat: MARKDOWN
      responses:
        "200":
          description: Prompt 版本创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersionApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/prompt-versions/{promptVersionId}/test-generate:
    post:
      tags:
        - 后台工具管理
      summary: 测试 Prompt 版本生成
      operationId: testGeneratePromptVersion
      security:
        - bearerAuth: []
      parameters:
        - name: promptVersionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestGenerateRequest"
      responses:
        "200":
          description: 测试生成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGenerateApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/prompt-versions/{promptVersionId}/publish:
    post:
      tags:
        - 后台工具管理
      summary: 发布 Prompt 版本
      operationId: publishPromptVersion
      security:
        - bearerAuth: []
      parameters:
        - name: promptVersionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 5
      responses:
        "200":
          description: Prompt 版本已发布
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersionApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/tools/{toolId}/publish:
    post:
      tags:
        - 后台工具管理
      summary: 后台发布工具
      operationId: publishAdminTool
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 工具状态已变更为 ONLINE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/tools/{toolId}/offline:
    post:
      tags:
        - 后台工具管理
      summary: 后台下架工具
      operationId: offlineAdminTool
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 工具状态已变更为 OFFLINE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/tasks:
    get:
      tags:
        - 后台任务管理
      summary: 后台查询任务列表
      operationId: listAdminTasks
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          example: QUEUED
        - name: toolCode
          in: query
          required: false
          schema:
            type: string
          example: xiaohongshu_copywriting
        - name: userId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          example: 2
      responses:
        "200":
          description: 后台任务列表，返回字段包含 userId，便于后台定位用户任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPageApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

