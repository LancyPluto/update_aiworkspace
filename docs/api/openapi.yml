openapi: 3.0.3
info:
  title: AI 工具市场 V1 API
  version: 0.3.0
  description: |
    AI 工具市场 V1 接口契约，用于用户端、管理端、Worker 和自动化测试联调?

    本文件按 `项目规划/V1-7天交付给组员弢发包` 中的 V1 范围整理?
    - 覆盖健康棢查登录鉴权工具市场任务算力管理端?Worker 内部回写主链路?
    - V1 不声明订单套餐支付审批多模开?API 等未纳入本周验收的能力?
    - 自动化测试可读取根节?`x-test-scenarios` 执行 P0 场景?
  contact:
    name: AI miniLab

servers:
  - url: http://localhost:8080
    description: Docker Compose 本地后端

tags:
  - name: Health
    description: 服务与依赖健康检?
  - name: UserAuth
    description: 用户认证
  - name: AdminAuth
    description: 管理员认?
  - name: Marketplace
    description: 用户端工具市?
  - name: Tasks
    description: 用户?AI 任务
  - name: Credits
    description: 用户端算力账?
  - name: AdminTools
    description: 管理端工具配?
  - name: AdminTasks
    description: 管理端任务追?
  - name: AdminUsers
    description: 管理端用户与算力
  - name: AdminBilling
    description: Admin billing logs and model costs
  - name: AdminModelConfig
    description: Admin model API configuration
  - name: InternalWorker
    description: Worker 内部接口
  - name: AgentChat
    description: 用户端 Agent 会话与运行（重新生成、编辑后生成）

x-test-data:
  users:
    normal:
      account: user1
      password: "123456"
      expectedUserType: USER
    disabled:
      account: disabled_user
      password: "123456"
      expectedErrorCode: FORBIDDEN
    admin:
      account: admin
      password: "123456"
      expectedUserType: ADMIN
  tools:
    primary:
      toolCode: xiaohongshu_copywriting
      expectedStatus: ONLINE
      requiredParams:
        productName: 五一护理套餐
        targetCustomer: 年轻女?
        style: 种草
  credits:
    defaultUserBalance: 100
    minimumDemoBalance: 50

x-test-scenarios:
  - id: HEALTH-001
    name: Docker 环境依赖健康棢?
    priority: P0
    steps:
      - operationId: health
        expect:
          status: 200
          body:
            code: SUCCESS
            data.mysql: ok
            data.redis: ok
      - operationId: userPing
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: adminPing
        expect:
          status: 200
          body:
            code: SUCCESS

  - id: AUTH-USER-HAPPY
    name: 用户登录并读取当前用?
    priority: P0
    steps:
      - operationId: loginUser
        save:
          userToken: $.data.accessToken
          userId: $.data.user.id
        request:
          account: user1
          password: "123456"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.user.userType: USER
      - operationId: getCurrentUser
        auth: userToken
        expect:
          status: 200
          body:
            code: SUCCESS
            data.userType: USER

  - id: AUTH-ERRORS
    name: 认证失败和权限边?
    priority: P0
    steps:
      - operationId: loginUser
        request:
          account: user1
          password: wrong-password
        expect:
          status: 400
          body:
            code: PARAM_ERROR
      - operationId: loginUser
        request:
          account: disabled_user
          password: "123456"
        expect:
          status: 400
          body:
            code: FORBIDDEN
      - operationId: getCurrentUser
        expect:
          status: 401
          body:
            code: UNAUTHORIZED
      - operationId: listAdminUsers
        auth: userToken
        expect:
          status: 403
          body:
            code: FORBIDDEN

  - id: AUTH-ADMIN-HAPPY
    name: 管理员登录并读取当前管理?
    priority: P0
    steps:
      - operationId: loginAdmin
        save:
          adminToken: $.data.accessToken
          adminId: $.data.user.id
        request:
          account: admin
          password: "123456"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.user.userType: ADMIN
      - operationId: getCurrentAdmin
        auth: adminToken
        expect:
          status: 200
          body:
            code: SUCCESS
            data.userType: ADMIN

  - id: TOOL-USER-VISIBLE
    name: 用户端能看到已上线工具并读取动表?
    priority: P0
    steps:
      - operationId: listToolCategories
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: listUserTools
        request:
          pageNo: 1
          pageSize: 20
        expect:
          status: 200
          body:
            code: SUCCESS
            data.total: ">=1"
      - operationId: getUserToolDetail
        path:
          toolCode: xiaohongshu_copywriting
        expect:
          status: 200
          body:
            code: SUCCESS
            data.toolCode: xiaohongshu_copywriting
            data.fields: "non-empty"

  - id: TASK-WORKER-SUCCESS
    name: 创建任务、Worker 成功回写、算力扣?
    priority: P0
    dependsOn: [AUTH-USER-HAPPY]
    steps:
      - operationId: getCreditAccount
        auth: userToken
        save:
          balanceBefore: $.data.balance
          frozenBefore: $.data.frozen
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: createTask
        auth: userToken
        save:
          taskId: $.data.taskId
          taskNo: $.data.taskNo
        request:
          toolCode: xiaohongshu_copywriting
          params:
            productName: 五一护理套餐
            targetCustomer: 年轻女?
            style: 种草
          clientRequestId: auto-task-success-001
        expect:
          status: 200
          body:
            code: SUCCESS
            data.status: QUEUED
      - operationId: getTaskStatus
        auth: userToken
        path:
          taskId: "{{taskId}}"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.status: QUEUED
      - operationId: getTaskExecutionContext
        path:
          taskId: "{{taskId}}"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.toolCode: xiaohongshu_copywriting
      - operationId: markTaskProcessing
        path:
          taskId: "{{taskId}}"
        request:
          progressMessage: AI 正在生成内容
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: markTaskSuccess
        path:
          taskId: "{{taskId}}"
        request:
          resourceType: MARKDOWN
          contentText: "# Generated result\n\nThis is acceptance test content."
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: getTaskDetail
        auth: userToken
        path:
          taskId: "{{taskId}}"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.status: SUCCESS
            data.result.resourceType: MARKDOWN
      - operationId: getCreditLogs
        auth: userToken
        request:
          pageNo: 1
          pageSize: 20
        expect:
          status: 200
          body:
            code: SUCCESS

  - id: TASK-WORKER-FAILED
    name: Worker 失败回写后任务失败并释放算力
    priority: P0
    dependsOn: [AUTH-USER-HAPPY]
    steps:
      - operationId: createTask
        auth: userToken
        save:
          failedTaskId: $.data.taskId
        request:
          toolCode: xiaohongshu_copywriting
          params:
            productName: 异常流程测试产品
            targetCustomer: 年轻女?
            style: 专业
          clientRequestId: auto-task-failed-001
        expect:
          status: 200
          body:
            code: SUCCESS
            data.status: QUEUED
      - operationId: markTaskProcessing
        path:
          taskId: "{{failedTaskId}}"
        request:
          progressMessage: AI 正在生成内容
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: markTaskFailed
        path:
          taskId: "{{failedTaskId}}"
        request:
          errorCode: MODEL_CALL_FAILED
          errorMessage: 模型调用失败
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: getTaskDetail
        auth: userToken
        path:
          taskId: "{{failedTaskId}}"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.status: FAILED
            data.errorCode: MODEL_CALL_FAILED

  - id: CREDIT-ADMIN-MANUAL-ADD
    name: 管理员手动加算力后用户账户和流水可查?
    priority: P0
    dependsOn: [AUTH-USER-HAPPY, AUTH-ADMIN-HAPPY]
    steps:
      - operationId: manualAddCredits
        auth: adminToken
        path:
          userId: "{{userId}}"
        request:
          amount: 50
          reason: 自动化测试补充算?
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: getCreditAccount
        auth: userToken
        expect:
          status: 200
          body:
            code: SUCCESS
            data.available: ">=50"
      - operationId: getCreditLogs
        auth: userToken
        request:
          pageNo: 1
          pageSize: 20
        expect:
          status: 200
          body:
            code: SUCCESS

paths:
  /api/health:
    get:
      tags: [Health]
      summary: 服务健康棢?
      operationId: health
      responses:
        "200":
          description: MySQL ?Redis 均可?
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthApiResponse"

  /api/v1/ping:
    get:
      tags: [Health]
      summary: 用户端接口连通测?
      operationId: userPing
      responses:
        "200":
          description: pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingApiResponse"

  /api/admin/v1/ping:
    get:
      tags: [Health]
      summary: 管理端接口连通测?
      operationId: adminPing
      responses:
        "200":
          description: pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingApiResponse"

  /api/v1/auth/register:
    post:
      tags: [UserAuth]
      summary: 用户账号密码注册
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              normal:
                value:
                  username: auto_user_001
                  password: "123456"
                  nickname: 自动化测试用?
      responses:
        "200":
          description: 注册成功并返回登录?
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/login:
    post:
      tags: [UserAuth]
      summary: 用户账号密码登录
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              user1:
                value:
                  account: user1
                  password: "123456"
              wrongPassword:
                value:
                  account: user1
                  password: wrong-password
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/sms-code:
    post:
      tags: [UserAuth]
      summary: 发短信验证码
      operationId: sendSmsCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsCodeRequest"
      responses:
        "200":
          description: 验证码已发或进入冷却
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/sms-register:
    post:
      tags: [UserAuth]
      summary: 手机号验证码注册
      operationId: smsRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsAuthRequest"
      responses:
        "200":
          description: 注册成功并返回登录?
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/sms-login:
    post:
      tags: [UserAuth]
      summary: 手机号验证码登录
      operationId: smsLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsAuthRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/logout:
    post:
      tags: [UserAuth]
      summary: 用户逢出登?
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 逢出成?
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me:
    get:
      tags: [UserAuth]
      summary: 获取当前用户信息
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/v1/auth/login:
    post:
      tags: [AdminAuth]
      summary: 管理员登?
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              admin:
                value:
                  account: admin
                  password: "123456"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/admin/v1/auth/me:
    get:
      tags: [AdminAuth]
      summary: 获取当前管理员信?
      operationId: getCurrentAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前管理?
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/auth/logout:
    post:
      tags: [AdminAuth]
      summary: 管理员出登?
      operationId: logoutAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 逢出成?
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"

  /api/v1/tool-categories:
    get:
      tags: [Marketplace]
      summary: 获取已启用工具分?
      operationId: listToolCategories
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCategoryListApiResponse"

  /api/v1/tools:
    get:
      tags: [Marketplace]
      summary: 获取用户端已上线工具列表
      operationId: listUserTools
      parameters:
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 工具分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"

  /api/v1/tools/search:
    get:
      tags: [Marketplace]
      summary: 搜索用户端已上线工具
      operationId: searchUserTools
      parameters:
        - $ref: "#/components/parameters/KeywordRequired"
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 工具分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"

  /api/v1/tools/{toolCode}:
    get:
      tags: [Marketplace]
      summary: 获取工具详情和动态表单字?
      operationId: getUserToolDetail
      parameters:
        - $ref: "#/components/parameters/ToolCode"
      responses:
        "200":
          description: 工具详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDetailApiResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tasks:
    post:
      tags: [Tasks]
      summary: 创建 AI 任务
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
            examples:
              xiaohongshu:
                value:
                  toolCode: xiaohongshu_copywriting
                  params:
                    productName: 五一护理套餐
                    targetCustomer: 年轻女?
                    style: 种草
                  clientRequestId: auto-task-001
      responses:
        "200":
          description: 任务已创建并入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Tasks]
      summary: 获取当前用户任务列表
      operationId: listUserTasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: 任务分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPageApiResponse"

  /api/v1/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: 获取任务详情和结?
      operationId: getTaskDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tasks/{taskId}/status:
    get:
      tags: [Tasks]
      summary: 获取任务状?
      operationId: getTaskStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务状?
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tasks/{taskId}/cancel:
    post:
      tags: [Tasks]
      summary: 取消任务
      operationId: cancelTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 取消后的任务状?
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/tasks/{taskId}/regenerate:
    post:
      tags: [Tasks]
      summary: 重新生成任务
      operationId: regenerateTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 新任务状?
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/agent/runs/{runId}/regenerate:
    post:
      tags: [AgentChat]
      summary: 对已完成运行重新生成（复用原 USER 消息）
      operationId: regenerateAgentRun
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateAgentRunRequest"
      responses:
        "200":
          description: 新运行已创建，返回 messageId（USER）与 runId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentMessageApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/agent/sessions/{sessionId}/messages/{messageId}/edit-regenerate:
    post:
      tags: [AgentChat]
      summary: 编辑用户消息后重新生成（截断该消息之后的分支）
      operationId: editRegenerateAgentMessage
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditRegenerateAgentMessageRequest"
      responses:
        "200":
          description: 新运行已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentMessageApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/credits/account:
    get:
      tags: [Credits]
      summary: 获取当前用户算力账户
      operationId: getCreditAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 算力账户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccountApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/credits/logs:
    get:
      tags: [Credits]
      summary: 获取当前用户算力流水
      operationId: getCreditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
        - name: logType
          in: query
          schema:
            $ref: "#/components/schemas/CreditLogType"
      responses:
        "200":
          description: 算力流水分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLogPageApiResponse"

