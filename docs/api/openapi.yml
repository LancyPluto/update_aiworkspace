components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiToken:
      type: apiKey
      in: header
      name: X-Internal-Signature

  parameters:
    PageNo:
      name: pageNo
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
    KeywordRequired:
      name: keyword
      in: query
      required: true
      schema:
        type: string
    CategoryId:
      name: categoryId
      in: query
      schema:
        type: integer
        format: int64
    ToolCode:
      name: toolCode
      in: path
      required: true
      schema:
        type: string
        example: xiaohongshu_copywriting
    ToolId:
      name: toolId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: 参数错误或业务规则不允许
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    Unauthorized:
      description: 未登录或 Token 失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    Forbidden:
      description: 无权?
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    NotFound:
      description: 资源不存?
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"

  schemas:
    ErrorCode:
      type: string
      enum:
        - SUCCESS
        - PARAM_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - ADMIN_UNAUTHORIZED
        - ADMIN_FORBIDDEN
        - TOOL_NOT_FOUND
        - TOOL_OFFLINE
        - CREDIT_NOT_ENOUGH
        - TASK_NOT_FOUND
        - TASK_STATUS_INVALID
        - MODEL_CALL_FAILED
        - SYSTEM_ERROR

    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          example: ok
        traceId:
          type: string
          nullable: true
          description: 当前实现使用 traceId；旧规划中的 requestId 视为同类追踪字段?

    PageBase:
      type: object
      properties:
        total:
          type: integer
          format: int64
        pageNo:
          type: integer
        pageSize:
          type: integer
        hasNext:
          type: boolean

    ErrorApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null

    EmptyApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null

    PingApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PingStatus"

    HealthApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthStatus"

    HealthStatus:
      type: object
      properties:
        service:
          type: string
          example: backend
        mysql:
          type: string
          example: ok
        redis:
          type: string
          example: ok

    PingStatus:
      type: object
      required: [scope, status]
      properties:
        scope:
          type: string
          enum: [user, admin]
          example: user
        status:
          type: string
          enum: [ok]
          example: ok

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
