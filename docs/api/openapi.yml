x-test-scenarios:
  - id: HEALTH-001
    name: Docker 鐜渚濊禆鍋ュ悍妫€鏌?
    priority: P0
    steps:
      - operationId: health
        expect:
          status: 200
          body:
            code: SUCCESS
            data.mysql: ok
            data.redis: ok
      - operationId: userPing
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: adminPing
        expect:
          status: 200
          body:
            code: SUCCESS

  - id: AUTH-USER-HAPPY
    name: 鐢ㄦ埛鐧诲綍骞惰鍙栧綋鍓嶇敤鎴?
    priority: P0
    steps:
      - operationId: loginUser
        save:
          userToken: $.data.accessToken
          userId: $.data.user.id
        request:
          account: user1
          password: "123456"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.user.userType: USER
      - operationId: getCurrentUser
        auth: userToken
        expect:
          status: 200
          body:
            code: SUCCESS
            data.userType: USER

  - id: AUTH-ERRORS
    name: 璁よ瘉澶辫触鍜屾潈闄愯竟鐣?
    priority: P0
    steps:
      - operationId: loginUser
        request:
          account: user1
          password: wrong-password
        expect:
          status: 400
          body:
            code: PARAM_ERROR
      - operationId: loginUser
        request:
          account: disabled_user
          password: "123456"
        expect:
          status: 400
          body:
            code: FORBIDDEN
      - operationId: getCurrentUser
        expect:
          status: 401
          body:
            code: UNAUTHORIZED
      - operationId: listAdminUsers
        auth: userToken
        expect:
          status: 403
          body:
            code: FORBIDDEN

  - id: AUTH-ADMIN-HAPPY
    name: 绠＄悊鍛樼櫥褰曞苟璇诲彇褰撳墠绠＄悊鍛?
    priority: P0
    steps:
      - operationId: loginAdmin
        save:
          adminToken: $.data.accessToken
          adminId: $.data.user.id
        request:
          account: admin
          password: "123456"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.user.userType: ADMIN
      - operationId: getCurrentAdmin
        auth: adminToken
        expect:
          status: 200
          body:
            code: SUCCESS
            data.userType: ADMIN

  - id: TOOL-USER-VISIBLE
    name: 鐢ㄦ埛绔兘鐪嬪埌宸蹭笂绾垮伐鍏峰苟璇诲彇鍔ㄦ€佽〃鍗?
