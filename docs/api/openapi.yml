              $ref: "#/components/schemas/ManualCreditRequest"
            examples:
              add:
                value:
                  amount: 50
                  reason: 自动化测试补充算力
      responses:
        "200":
          description: 增加后的账户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccountApiResponse"

  /api/admin/v1/users/{userId}/credits/manual-deduct:
    post:
      tags: [AdminUsers]
      summary: 管理员手动扣减算力
      operationId: manualDeductCredits
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualCreditRequest"
      responses:
        "200":
          description: 扣减后的账户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccountApiResponse"

  /api/internal/v1/tasks/{taskId}/execution-context:
    get:
      tags: [InternalWorker]
      summary: Worker 获取任务执行上下文
      operationId: getTaskExecutionContext
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务执行上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecutionContextApiResponse"

  /api/internal/v1/tasks/{taskId}/processing:
    post:
      tags: [InternalWorker]
      summary: Worker 标记任务处理中
      operationId: markTaskProcessing
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessingRequest"
      responses:
        "200":
          description: 标记成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/internal/v1/tasks/{taskId}/success:
    post:
      tags: [InternalWorker]
      summary: Worker 回写成功结果
      operationId: markTaskSuccess
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskSuccessRequest"
      responses:
        "200":
          description: 回写成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/internal/v1/tasks/{taskId}/failed:
    post:
      tags: [InternalWorker]
      summary: Worker 回写失败
      operationId: markTaskFailed
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskFailedRequest"
      responses:
        "200":
          description: 回写成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiToken:
      type: apiKey
      in: header
      name: X-Internal-Signature

  parameters:
    PageNo:
      name: pageNo
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
    KeywordRequired:
      name: keyword
      in: query
      required: true
      schema:
        type: string
    CategoryId:
      name: categoryId
      in: query
      schema:
        type: integer
        format: int64
    ToolCode:
      name: toolCode
      in: path
      required: true
      schema:
        type: string
        example: xiaohongshu_copywriting
    ToolId:
      name: toolId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: 参数错误或业务规则不允许
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    Unauthorized:
      description: 未登录或 Token 失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"

  schemas:
    ErrorCode:
      type: string
      enum:
        - SUCCESS
        - PARAM_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - ADMIN_UNAUTHORIZED
        - ADMIN_FORBIDDEN
        - TOOL_NOT_FOUND
        - TOOL_OFFLINE
        - CREDIT_NOT_ENOUGH
        - TASK_NOT_FOUND
        - TASK_STATUS_INVALID
        - MODEL_CALL_FAILED
        - SYSTEM_ERROR

    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          example: ok
        traceId:
          type: string
          nullable: true
          description: 当前实现使用 traceId；旧规划中的 requestId 视为同类追踪字段。

    PageBase:
      type: object
      properties:
        total:
          type: integer
          format: int64
        pageNo:
          type: integer
        pageSize:
          type: integer
        hasNext:
          type: boolean

    ErrorApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null

    EmptyApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: object
              nullable: true
              example: null

    PingApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PingStatus"

    HealthApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthStatus"

    HealthStatus:
      type: object
      properties:
        service:
          type: string
          example: backend
        mysql:
          type: string
          example: ok
        redis:
          type: string
          example: ok

    PingStatus:
      type: object
      required: [scope, status]
      properties:
        scope:
          type: string
          enum: [user, admin]
          example: user
        status:
          type: string
          enum: [ok]
          example: ok

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: auto_user_001
        password:
          type: string
          format: password
          example: "123456"
        nickname:
          type: string
          example: 自动化测试用户
        phone:
          type: string
          example: "13376644413"
        email:
          type: string
          example: user@example.com

    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account:
          type: string
          example: user1
        password:
          type: string
          format: password
          example: "123456"

    SmsCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: "13376644413"
        scene:
          type: string
          enum: [REGISTER, LOGIN]
          default: REGISTER

    SmsAuthRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          example: "13376644413"
        code:
          type: string
          example: "123456"
        nickname:
          type: string
          example: 手机用户

    LoginApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/LoginResult"

    LoginResult:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfileApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 2
        username:
          type: string
          nullable: true
          example: user1
        nickname:
          type: string
          nullable: true
          example: User One
        userType:
          type: string
          enum: [USER, ADMIN]
          example: USER
        status:
          type: string
          enum: [ACTIVE, DISABLED]
          example: ACTIVE
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true

    ToolStatus:
      type: string
      enum: [DRAFT, ONLINE, OFFLINE]

    ToolCategoryListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ToolCategory"

    ToolCategory:
      type: object
      properties:
        id:
          type: integer
          format: int64
        categoryCode:
          type: string
          example: copywriting
        categoryName:
          type: string
          example: Copywriting
        sortOrder:
          type: integer
        status:
          type: string
          example: ACTIVE

    ToolPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ToolPage"

    ToolPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/ToolSummary"
        total:
          type: integer
          format: int64
        pageNo:
          type: integer
        pageSize:
          type: integer
        hasNext:
          type: boolean

    ToolSummaryApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ToolSummary"

    ToolSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        toolCode:
          type: string
          example: xiaohongshu_copywriting
        toolName:
          type: string
          example: AI 小红书文案生成器
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
          example: Copywriting
        description:
          type: string
        coverUrl:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ToolStatus"
        estimatedCreditCost:
          type: integer
          example: 1

    ToolDetailApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ToolDetail"

    ToolDetail:
      allOf:
        - $ref: "#/components/schemas/ToolSummary"
        - type: object
          properties:
            fields:
              type: array
              items:
                $ref: "#/components/schemas/ToolField"

    ToolFieldListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ToolField"

    ToolField:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fieldKey:
          type: string
          example: productName
        fieldName:
          type: string
          example: 产品名称
        fieldType:
          type: string
          enum: [text, textarea, select, number]
        placeholder:
          type: string
          nullable: true
        options:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SelectOption"
        optionsJson:
          type: string
          nullable: true
        validationJson:
          type: string
          nullable: true
        required:
          type: boolean
        sortOrder:
          type: integer
        status:
          type: string
          example: ACTIVE

    SelectOption:
      type: object
      properties:
        label:
          type: string
        value:
          type: string

    UpsertToolRequest:
      type: object
      required: [toolCode, toolName, categoryId, status, estimatedCreditCost]
      properties:
        toolCode:
          type: string
        toolName:
          type: string
        categoryId:
          type: integer
          format: int64
        description:
          type: string
        coverUrl:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ToolStatus"
        estimatedCreditCost:
          type: integer
          minimum: 0

    UpdateToolFieldsRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ToolFieldRequest"

    ToolFieldRequest:
      type: object
      required: [fieldKey, fieldName, fieldType, required, sortOrder]
      properties:
        fieldKey:
          type: string
        fieldName:
          type: string
        fieldType:
          type: string
          enum: [text, textarea, select, number]
        placeholder:
          type: string
          nullable: true
        optionsJson:
          type: string
          nullable: true
        validationJson:
          type: string
          nullable: true
        required:
          type: boolean
        sortOrder:
          type: integer

    TaskStatus:
      type: string
      enum: [CREATED, QUEUED, PROCESSING, RETRYING, SUCCESS, FAILED, TIMEOUT, CANCELLED]

    CreateTaskRequest:
      type: object
      required: [toolCode, params]
      properties:
        toolCode:
          type: string
          example: xiaohongshu_copywriting
        params:
          type: object
          additionalProperties: true
          example:
            productName: 五一护理套餐
            targetCustomer: 年轻女性
            style: 种草
        clientRequestId:
          type: string
          nullable: true
          description: 前端幂等请求 ID，对应规划里的 clientRequestId。

    RegenerateTaskRequest:
      type: object
      properties:
        params:
          type: object
          additionalProperties: true
          description: 重新生成时覆盖原任务参数；为空则沿用原参数。

    TaskStatusApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskStatusResult"

    TaskStatusResult:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        taskNo:
          type: string
          example: T202605070001
        status:
          $ref: "#/components/schemas/TaskStatus"
        progress:
          type: integer
          minimum: 0
          maximum: 100
        progressMessage:
          type: string
          nullable: true

    TaskPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskPage"

    TaskPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/TaskDetail"
        total:
          type: integer
          format: int64
        pageNo:
          type: integer
        pageSize:
          type: integer
        hasNext:
          type: boolean

    TaskDetailApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskDetail"

    TaskDetail:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        taskNo:
          type: string
        toolCode:
          type: string
        toolName:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        progress:
          type: integer
        progressMessage:
          type: string
          nullable: true
        params:
          type: object
          additionalProperties: true
        result:
          $ref: "#/components/schemas/TaskResult"
        results:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/TaskResult"
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        estimatedCreditCost:
          type: integer
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
