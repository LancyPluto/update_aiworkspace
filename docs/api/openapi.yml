components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiToken:
      type: apiKey
      in: header
      name: X-Internal-Signature

  parameters:
    PageNo:
      name: pageNo
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
    KeywordRequired:
      name: keyword
      in: query
      required: true
      schema:
        type: string
    CategoryId:
      name: categoryId
      in: query
      schema:
        type: integer
        format: int64
    ToolCode:
      name: toolCode
      in: path
      required: true
      schema:
        type: string
        example: xiaohongshu_copywriting
    ToolId:
      name: toolId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: 鍙傛暟閿欒鎴栦笟鍔¤鍒欎笉鍏佽
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    Unauthorized:
      description: 鏈櫥褰曟垨 Token 澶辨晥
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    Forbidden:
      description: 鏃犳潈闄?
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    NotFound:
      description: 璧勬簮涓嶅瓨鍦?
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"

  schemas:
    ErrorCode:
      type: string
      enum:
        - SUCCESS
        - PARAM_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - ADMIN_UNAUTHORIZED
        - ADMIN_FORBIDDEN
        - TOOL_NOT_FOUND
        - TOOL_OFFLINE
        - CREDIT_NOT_ENOUGH
        - TASK_NOT_FOUND
        - TASK_STATUS_INVALID
        - MODEL_CALL_FAILED
        - SYSTEM_ERROR

    ApiResponse:
      type: object
