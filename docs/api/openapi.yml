        expect:
          status: 200
          body:
            code: SUCCESS
            data.status: QUEUED
      - operationId: markTaskProcessing
        path:
          taskId: "{{failedTaskId}}"
        request:
          progressMessage: AI 姝ｅ湪鐢熸垚鍐呭
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: markTaskFailed
        path:
          taskId: "{{failedTaskId}}"
        request:
          errorCode: MODEL_CALL_FAILED
          errorMessage: 妯″瀷璋冪敤澶辫触
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: getTaskDetail
        auth: userToken
        path:
          taskId: "{{failedTaskId}}"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.status: FAILED
            data.errorCode: MODEL_CALL_FAILED

  - id: CREDIT-ADMIN-MANUAL-ADD
    name: 绠＄悊鍛樻墜鍔ㄥ姞绠楀姏鍚庣敤鎴疯处鎴峰拰娴佹按鍙煡璇?
    priority: P0
    dependsOn: [AUTH-USER-HAPPY, AUTH-ADMIN-HAPPY]
    steps:
      - operationId: manualAddCredits
        auth: adminToken
        path:
          userId: "{{userId}}"
        request:
          amount: 50
          reason: 鑷姩鍖栨祴璇曡ˉ鍏呯畻鍔?
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: getCreditAccount
        auth: userToken
        expect:
          status: 200
          body:
            code: SUCCESS
            data.available: ">=50"
      - operationId: getCreditLogs
        auth: userToken
        request:
          pageNo: 1
          pageSize: 20
        expect:
          status: 200
          body:
            code: SUCCESS

