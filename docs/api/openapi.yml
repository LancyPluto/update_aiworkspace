openapi: 3.0.3
info:
  title: AI 工具市场 V1 API
  description: 当前后端实现的 V1 接口契约，供用户端、管理端、Worker 和测试联调统一使用。
  version: 0.2.0
servers:
  - url: http://localhost:8080
    description: 本地 Spring Boot 服务

tags:
  - name: 健康检查
  - name: 用户认证
  - name: 管理员认证
  - name: 工具市场
  - name: 用户任务
  - name: 算力账户
  - name: 后台工具管理
  - name: 后台任务管理
  - name: 后台用户管理
  - name: Worker 内部接口

paths:
  /api/health:
    get:
      tags: [健康检查]
      summary: 服务健康检查
      operationId: health
      responses:
        "200":
          description: 健康检查结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthApiResponse"

  /api/v1/ping:
    get:
      tags: [健康检查]
      summary: 用户端接口连通性测试
      operationId: userPing
      responses:
        "200":
          description: pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringApiResponse"

  /api/admin/v1/ping:
    get:
      tags: [健康检查]
      summary: 管理端接口连通性测试
      operationId: adminPing
      responses:
        "200":
          description: pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringApiResponse"

  /api/v1/auth/register:
    post:
      tags: [用户认证]
      summary: 普通用户注册
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功并返回登录态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/login:
    post:
      tags: [用户认证]
      summary: 普通用户登录
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/logout:
    post:
      tags: [用户认证]
      summary: 普通用户退出登录
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me:
    get:
      tags: [用户认证]
      summary: 获取当前用户信息
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/v1/auth/login:
    post:
      tags: [管理员认证]
      summary: 管理员登录
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/admin/v1/auth/logout:
    post:
      tags: [管理员认证]
      summary: 管理员退出登录
      operationId: logoutAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyApiResponse"

  /api/admin/v1/auth/me:
    get:
      tags: [管理员认证]
      summary: 获取当前管理员信息
      operationId: getCurrentAdmin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前管理员信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileApiResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/tool-categories:
    get:
      tags: [工具市场]
      summary: 获取启用的工具分类列表
      operationId: listToolCategories
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCategoryListApiResponse"

  /api/v1/tools:
    get:
      tags: [工具市场]
      summary: 获取已上线工具列表
      operationId: listUserTools
      parameters:
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 已上线工具分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"

  /api/v1/tools/search:
    get:
      tags: [工具市场]
      summary: 搜索已上线工具
      operationId: searchUserTools
      parameters:
        - $ref: "#/components/parameters/RequiredKeyword"
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"

  /api/v1/tools/{toolCode}:
    get:
      tags: [工具市场]
      summary: 获取工具详情和动态字段配置
      operationId: getUserToolDetail
      parameters:
        - $ref: "#/components/parameters/ToolCode"
      responses:
        "200":
          description: 工具详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDetailApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/tasks:
    post:
      tags: [用户任务]
      summary: 创建 AI 任务
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "200":
          description: 任务创建成功，算力进入冻结状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [用户任务]
      summary: 获取当前用户任务列表
      operationId: listUserTasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskStatusQuery"
        - $ref: "#/components/parameters/ToolCodeQuery"
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 当前用户任务分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPageApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tasks/{taskId}:
    get:
      tags: [用户任务]
      summary: 获取任务详情和结果
      operationId: getTaskDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailApiResponse"

  /api/v1/tasks/{taskId}/status:
    get:
      tags: [用户任务]
      summary: 查询任务状态
      operationId: getTaskStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/v1/tasks/{taskId}/cancel:
    post:
      tags: [用户任务]
      summary: 用户取消任务
      operationId: cancelUserTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 取消成功，冻结算力释放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/v1/tasks/{taskId}/regenerate:
    post:
      tags: [用户任务]
      summary: 基于历史任务重新生成
      operationId: regenerateTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateTaskRequest"
      responses:
        "200":
          description: 新任务创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusApiResponse"

  /api/v1/credits/account:
    get:
      tags: [算力账户]
      summary: 获取当前用户算力账户
      operationId: getCreditAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户算力账户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccountApiResponse"

  /api/v1/credits/logs:
    get:
      tags: [算力账户]
      summary: 获取当前用户算力流水
      operationId: listCreditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LogType"
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 算力流水分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLogPageApiResponse"

  /api/admin/v1/tools:
    get:
      tags: [后台工具管理]
      summary: 后台查询工具列表
      operationId: listAdminTools
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/CategoryId"
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ONLINE, OFFLINE]
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 后台工具分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolPageApiResponse"
    post:
      tags: [后台工具管理]
      summary: 新增工具草稿
      operationId: createAdminTool
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertToolRequest"
      responses:
        "200":
          description: 工具创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"

  /api/admin/v1/tools/{toolId}:
    get:
      tags: [后台工具管理]
      summary: 获取后台工具详情
      operationId: getAdminToolDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ToolId"
      responses:
        "200":
          description: 工具详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDetailApiResponse"
    put:
      tags: [后台工具管理]
      summary: 编辑工具基础信息
      operationId: updateAdminTool
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ToolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToolRequest"
      responses:
        "200":
          description: 工具更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSummaryApiResponse"

