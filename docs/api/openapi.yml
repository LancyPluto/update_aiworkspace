    steps:
      - operationId: listToolCategories
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: listUserTools
        request:
          pageNo: 1
          pageSize: 20
        expect:
          status: 200
          body:
            code: SUCCESS
            data.total: ">=1"
      - operationId: getUserToolDetail
        path:
          toolCode: xiaohongshu_copywriting
        expect:
          status: 200
          body:
            code: SUCCESS
            data.toolCode: xiaohongshu_copywriting
            data.fields: "non-empty"

  - id: TASK-WORKER-SUCCESS
    name: 鍒涘缓浠诲姟銆乄orker 鎴愬姛鍥炲啓銆佺畻鍔涙墸闄?
    priority: P0
    dependsOn: [AUTH-USER-HAPPY]
    steps:
      - operationId: getCreditAccount
        auth: userToken
        save:
          balanceBefore: $.data.balance
          frozenBefore: $.data.frozen
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: createTask
        auth: userToken
        save:
          taskId: $.data.taskId
          taskNo: $.data.taskNo
        request:
          toolCode: xiaohongshu_copywriting
          params:
            productName: 浜斾竴鎶ょ悊濂楅
            targetCustomer: 骞磋交濂虫€?
            style: 绉嶈崏
          clientRequestId: auto-task-success-001
        expect:
          status: 200
          body:
            code: SUCCESS
            data.status: QUEUED
      - operationId: getTaskStatus
        auth: userToken
        path:
          taskId: "{{taskId}}"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.status: QUEUED
      - operationId: getTaskExecutionContext
        path:
          taskId: "{{taskId}}"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.toolCode: xiaohongshu_copywriting
      - operationId: markTaskProcessing
        path:
          taskId: "{{taskId}}"
        request:
          progressMessage: AI 姝ｅ湪鐢熸垚鍐呭
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: markTaskSuccess
        path:
          taskId: "{{taskId}}"
        request:
          resourceType: MARKDOWN
          contentText: "# Generated result\n\nThis is acceptance test content."
        expect:
          status: 200
          body:
            code: SUCCESS
      - operationId: getTaskDetail
        auth: userToken
        path:
          taskId: "{{taskId}}"
        expect:
          status: 200
          body:
            code: SUCCESS
            data.status: SUCCESS
            data.result.resourceType: MARKDOWN
      - operationId: getCreditLogs
        auth: userToken
        request:
          pageNo: 1
          pageSize: 20
        expect:
          status: 200
          body:
            code: SUCCESS

  - id: TASK-WORKER-FAILED
    name: Worker 澶辫触鍥炲啓鍚庝换鍔″け璐ュ苟閲婃斁绠楀姏
    priority: P0
    dependsOn: [AUTH-USER-HAPPY]
    steps:
      - operationId: createTask
        auth: userToken
        save:
          failedTaskId: $.data.taskId
        request:
          toolCode: xiaohongshu_copywriting
          params:
            productName: 寮傚父娴佺▼娴嬭瘯浜у搧
            targetCustomer: 骞磋交濂虫€?
