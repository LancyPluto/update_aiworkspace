  /api/admin/v1/tools/{toolId}/prompts:
    get:
      tags:
        - 后台工具管理
      summary: 获取工具 Prompt 列表
      operationId: listAdminToolPrompts
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: 工具 Prompt 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptListApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - 后台工具管理
      summary: 创建 Prompt 草稿
      operationId: createAdminToolPrompt
      security:
        - bearerAuth: []
      parameters:
        - name: toolId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptRequest"
            example:
              promptCode: default
              promptName: 默认 Prompt
      responses:
        "200":
          description: Prompt 草稿创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/prompts/{promptId}/versions:
    get:
      tags:
        - 后台工具管理
      summary: 列出指定 Prompt 的全部版本（按 id 倒序）
      operationId: listPromptVersions
      security:
        - bearerAuth: []
      parameters:
        - name: promptId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 3
      responses:
        "200":
          description: Prompt 版本列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PromptVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - 后台工具管理
      summary: 新建 Prompt 版本草稿
      operationId: createPromptVersion
      security:
        - bearerAuth: []
      parameters:
        - name: promptId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptVersionRequest"
            example:
              versionNo: v1
              systemPrompt: 你是专业文案助手
              userPromptTemplate: |
                请根据输入参数生成内容：{{input}}
              outputFormat: MARKDOWN
      responses:
        "200":
          description: Prompt 版本创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersionApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/prompt-versions/{promptVersionId}/test-generate:
    post:
      tags:
        - 后台工具管理
      summary: 测试 Prompt 版本生成
      operationId: testGeneratePromptVersion
      security:
        - bearerAuth: []
      parameters:
        - name: promptVersionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestGenerateRequest"
      responses:
        "200":
          description: 测试生成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGenerateApiResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/prompt-versions/{promptVersionId}/publish:
