        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Worker 内部接口令牌，本地默认值为 local-internal-token，部署时使用 INTERNAL_API_TOKEN 环境变量覆盖。

  responses:
    BadRequest:
      description: 业务错误或参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"
          example:
            code: PARAM_ERROR
            message: 参数错误
            data: null
            requestId: null
    Unauthorized:
      description: 未登录或 Token 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"
          example:
            code: UNAUTHORIZED
            message: 未登录或 Token 失效
            data: null
            requestId: null
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyApiResponse"
          example:
            code: ADMIN_FORBIDDEN
            message: 管理员无权限
            data: null
            requestId: null

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 唯一用户名。
          example: test001
        password:
          type: string
          minLength: 6
          maxLength: 64
          example: "123456"
        nickname:
          type: string
          nullable: true
          description: 可选昵称，不传或为空时默认使用用户名。
          example: 测试用户

    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          description: 用户名。
          example: user1
        password:
          type: string
          example: "123456"

    UpsertToolRequest:
      type: object
      required:
        - toolCode
        - toolName
        - categoryId
        - estimatedCreditCost
      properties:
        toolCode:
          type: string
          description: 工具唯一编码，新增工具时必填。
          example: xiaohongshu_copywriting
        toolName:
          type: string
          example: 小红书文案生成
        categoryId:
          type: integer
          format: int64
          example: 1
        description:
          type: string
          nullable: true
          example: 根据产品信息生成小红书文案
        coverUrl:
          type: string
          nullable: true
          example: ""
        estimatedCreditCost:
          type: integer
          minimum: 0
          example: 10

    UpdateToolRequest:
      type: object
      required:
        - toolName
        - categoryId
        - estimatedCreditCost
      properties:
        toolCode:
          type: string
          nullable: true
          description: 当前编辑接口会忽略该字段。
        toolName:
          type: string
          example: 小红书文案生成 Pro
        categoryId:
          type: integer
          format: int64
          example: 1
        description:
          type: string
          nullable: true
          example: 根据产品信息生成更完整的小红书文案
        coverUrl:
          type: string
          nullable: true
          example: ""
        estimatedCreditCost:
          type: integer
          minimum: 0
          example: 12

    CreateFieldSchemaRequest:
      type: object
      required:
        - schemaVersion
        - fields
      properties:
        schemaVersion:
          type: string
          example: v2
        fields:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FieldSchemaItemInput"

    FieldSchemaItemInput:
      type: object
      required:
        - fieldKey
        - fieldName
        - fieldType
      properties:
        fieldKey:
          type: string
          example: brandName
        fieldName:
          type: string
          example: 品牌名称
        fieldType:
          type: string
          enum:
            - text
            - textarea
            - select
            - number
          example: text
        placeholder:
          type: string
          nullable: true
          example: 请输入品牌名称
        optionsJson:
          type: string
          nullable: true
          example: '[{"label":"A","value":"a"}]'
        required:
          type: boolean
          example: true
        sortOrder:
          type: integer
          example: 1

    CreatePromptRequest:
      type: object
      required:
        - promptCode
        - promptName
      properties:
        promptCode:
          type: string
          example: default
        promptName:
          type: string
          example: 默认 Prompt

    CreatePromptVersionRequest:
      type: object
      required:
        - versionNo
        - userPromptTemplate
      properties:
        versionNo:
          type: string
          example: v1
        systemPrompt:
          type: string
          nullable: true
          example: 你是专业文案助手
        userPromptTemplate:
          type: string
          example: 请根据输入参数输出内容：{{input}}
        outputFormat:
          type: string
          example: MARKDOWN

    TestGenerateRequest:
      type: object
      required:
        - params
      properties:
        params:
          type: object
          additionalProperties: true

    ManualAddCreditsRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: integer
          minimum: 1
          example: 100
        reason:
          type: string
          nullable: true
          example: 补偿算力

    ApiResponseBase:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - SUCCESS
            - PARAM_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - ADMIN_UNAUTHORIZED
            - ADMIN_FORBIDDEN
            - TOOL_NOT_FOUND
            - TOOL_OFFLINE
            - CREDIT_NOT_ENOUGH
            - TASK_NOT_FOUND
            - TASK_STATUS_INVALID
            - MODEL_CALL_FAILED
            - SYSTEM_ERROR
          example: SUCCESS
        message:
          type: string
          example: ok
        requestId:
          type: string
          nullable: true
          example: null

    EmptyApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              nullable: true
              example: null

    StringApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: string
              example: pong

    HealthApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthStatus"

    HealthStatus:
      type: object
      properties:
        service:
          type: string
          example: backend
        mysql:
          type: string
          example: ok
        redis:
          type: string
          example: ok

    LoginApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/LoginResponse"

    UserProfileApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UserProfile"

    ToolCategoryListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ToolCategory"

    ToolPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ToolPage"

    ToolSummaryApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ToolSummary"

    ToolDetailApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ToolDetail"

    ToolFieldListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ToolField"

    FieldSchemaListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/FieldSchema"

    FieldSchemaApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FieldSchema"

    PromptListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Prompt"

    PromptApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Prompt"

    PromptVersionApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PromptVersion"

    TestGenerateApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TestGenerateResult"

    AdminUserPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdminUserPage"

    CreditManualAddApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CreditManualAddResult"

    CreditAccountApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CreditAccount"

    TaskStatusApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskStatus"

    TaskDetailApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskDetail"

    TaskPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TaskPage"

    ExecutionContextApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponseBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ExecutionContext"

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT 访问令牌。
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: user1
        nickname:
          type: string
          example: 用户一
        userType:
          type: string
          enum:
            - USER
            - ADMIN
          example: USER

    ToolCategory:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        categoryCode:
          type: string
          example: copywriting
        categoryName:
          type: string
          example: 文案生成
        sortOrder:
          type: integer
          example: 1

    ToolPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/ToolSummary"
        total:
          type: integer
          format: int64
          example: 1

    ToolSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        toolCode:
          type: string
          example: xiaohongshu_copywriting
        toolName:
          type: string
          example: 小红书文案生成
        categoryId:
          type: integer
          format: int64
          example: 1
        categoryName:
          type: string
          example: 文案生成
        description:
          type: string
          nullable: true
          example: 根据产品信息生成小红书文案
        coverUrl:
          type: string
          nullable: true
          example: ""
        status:
          type: string
          enum:
            - DRAFT
            - ONLINE
            - OFFLINE
          example: ONLINE
        estimatedCreditCost:
          type: integer
          example: 10

    ToolDetail:
      allOf:
        - $ref: "#/components/schemas/ToolSummary"
        - type: object
          properties:
            fields:
              type: array
              items:
                $ref: "#/components/schemas/ToolField"

    ToolField:
      type: object
      properties:
        fieldKey:
          type: string
          example: productName
        fieldName:
          type: string
          example: 产品名称
        fieldType:
          type: string
          enum:
            - text
            - textarea
            - select
            - number
          example: text
        placeholder:
          type: string
          nullable: true
          example: 请输入产品名称
        optionsJson:
          type: string
          nullable: true
          example: '[{"label":"A","value":"a"}]'
        required:
          type: boolean
          example: true
        sortOrder:
          type: integer
          example: 1

    ToolFieldOption:
      type: object
      properties:
        label:
          type: string
          example: 种草
        value:
          type: string
          example: 种草

    FieldSchema:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 11
        toolId:
          type: integer
          format: int64
          example: 1
        schemaVersion:
          type: string
          example: v2
        status:
          type: string
          example: ACTIVE
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ToolField"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Prompt:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 3
        toolId:
          type: integer
          format: int64
          example: 1
        promptCode:
          type: string
          example: default
        promptName:
          type: string
          example: 默认 Prompt
        activeVersionId:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          example: ACTIVE

    PromptVersion:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 5
        promptId:
          type: integer
          format: int64
          example: 3
        versionNo:
          type: string
          example: v1
        systemPrompt:
          type: string
          nullable: true
        userPromptTemplate:
          type: string
        outputFormat:
          type: string
          example: MARKDOWN
        status:
          type: string
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true

    TestGenerateResult:
      type: object
      properties:
        output:
          type: string
          example: 这是测试生成内容

    AdminUserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        userType:
          type: string
          example: USER
        status:
          type: string
          example: ACTIVE
        credits:
          type: integer
          example: 120
        createdAt:
          type: string
          format: date-time

    AdminUserPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummary"
        total:
          type: integer
          format: int64
          example: 1

    CreditManualAddResult:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        amount:
          type: integer
          example: 100
        balanceBefore:
          type: integer
          example: 20
        balanceAfter:
          type: integer
          example: 120
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreditAccount:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 2
        balance:
          type: integer
          example: 100
        frozen:
          type: integer
          example: 0
        totalGranted:
          type: integer
          example: 100
        totalConsumed:
          type: integer
          example: 0
        status:
          type: string
          example: ACTIVE

    CreateTaskRequest:
      type: object
      required:
        - toolCode
        - params
      properties:
        toolCode:
          type: string
          example: xiaohongshu_copywriting
        params:
          type: object
          additionalProperties: true
          example:
            productName: 测试产品
            targetCustomer: 年轻用户
            style: 种草
        clientRequestId:
          type: string
          nullable: true
          example: uuid-from-frontend

    TaskStatus:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
          example: 1
        taskNo:
          type: string
          example: T20260508AF040D708A
        userId:
          type: integer
          format: int64
          example: 2
        status:
          type: string
          enum:
            - CREATED
            - QUEUED
            - PROCESSING
            - RETRYING
            - SUCCESS
            - FAILED
            - TIMEOUT
            - CANCELLED
          example: QUEUED
        progress:
          type: integer
          example: 0
        progressMessage:
          type: string
          example: 任务已排队

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskStatus"
        - type: object
          properties:
            toolCode:
              type: string
              example: xiaohongshu_copywriting
            toolName:
              type: string
              example: 小红书文案生成
            userNickname:
              type: string
              example: 用户一
            consumedCredits:
              type: integer
              example: 10
            errorCode:
              type: string
              nullable: true
              example: MODEL_CALL_FAILED
            errorMessage:
              type: string
              nullable: true
              example: 模型调用超时
            params:
              type: object
              additionalProperties: true
            result:
              nullable: true
              $ref: "#/components/schemas/TaskResult"
            createdAt:
              type: string
              format: date-time
            finishedAt:
              type: string
              format: date-time
              nullable: true
            logs:
              type: array
              items:
                $ref: "#/components/schemas/TaskLog"
            creditLogs:
              type: array
              items:
                $ref: "#/components/schemas/CreditLogItem"

    TaskResult:
      type: object
      properties:
        resourceType:
          type: string
          example: MARKDOWN
        contentText:
          type: string
          example: 生成内容

    TaskLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        eventType:
          type: string
          example: STATUS_CHANGED
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreditLogItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        logType:
          type: string
          example: CONSUME
        amount:
          type: integer
          example: 10
        balanceBefore:
          type: integer
          example: 100
        balanceAfter:
          type: integer
          example: 90
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    TaskPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/TaskDetail"
        total:
          type: integer
          format: int64
          example: 1

    ExecutionContext:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
          example: 1
        taskNo:
          type: string
          example: T20260508AF040D708A
        userId:
          type: integer
          format: int64
          example: 2
        toolId:
          type: integer
          format: int64
          example: 1
        toolCode:
          type: string
          example: xiaohongshu_copywriting
        toolName:
          type: string
          example: 小红书文案生成
        status:
          type: string
          example: QUEUED
        params:
          type: object
          additionalProperties: true
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ToolField"

    WorkerProcessingRequest:
      type: object
      properties:
        progress:
          type: integer
          minimum: 0
          maximum: 99
          example: 35
        progressMessage:
          type: string
          example: AI 正在生成内容

    WorkerSuccessRequest:
      type: object
      required:
        - resourceType
        - contentText
      properties:
        resourceType:
          type: string
          example: MARKDOWN
        contentText:
          type: string
          example: "# Generated result"

    WorkerFailedRequest:
      type: object
      properties:
        errorCode:
          type: string
          example: MODEL_CALL_FAILED
        errorMessage:
          type: string
          example: 模型调用超时
