      description: Worker 内部接口令牌，本地默认 local-internal-token。

  parameters:
    Keyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
    RequiredKeyword:
      name: keyword
      in: query
      required: true
      schema:
        type: string
    PageNo:
      name: pageNo
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
