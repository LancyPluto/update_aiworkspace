# 仅启动 PPT 引擎 API（供 ai-tool-market BFF 调用）
# 用户界面在 user-web PptWorkspace，不使用本仓库 frontend。
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: banana-slides-engine
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    volumes:
      - ./backend/instance:/app/backend/instance
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
