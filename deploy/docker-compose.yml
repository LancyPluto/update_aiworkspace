services:
  mysql:
    image: ${DOCKER_REGISTRY:-docker.1ms.run/}mysql:8.0
    container_name: ai-supermarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: ai_supermarket_v1
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 忽略客户端握手里的字符集，统一用服务端 utf8mb4，减少 JDBC/客户端默认 latin1 导致的乱码
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${DOCKER_REGISTRY:-docker.1ms.run/}redis:7
    container_name: ai-supermarket-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: ${DOCKER_REGISTRY:-docker.1ms.run/}rabbitmq:3.13-management
    container_name: ai-supermarket-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.1ms.run/}
    image: deploy-backend
    container_name: ai-supermarket-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ai_supermarket_v1
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root123456
      MYSQL_CONNECTION_INIT_SQL: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      TASK_QUEUE_BACKEND: ${TASK_QUEUE_BACKEND:-rabbitmq}
      RABBITMQ_TASK_EXCHANGE: ${RABBITMQ_TASK_EXCHANGE:-ai.task.exchange}
      RABBITMQ_TASK_ROUTING_KEY: ${RABBITMQ_TASK_ROUTING_KEY:-tool.normal}
      RABBITMQ_TASK_QUEUE: ${RABBITMQ_TASK_QUEUE:-ai.tool.normal}
      RABBITMQ_DEAD_QUEUE: ${RABBITMQ_DEAD_QUEUE:-ai.tool.normal.dead}
      RABBITMQ_RETRY_QUEUE_PREFIX: ${RABBITMQ_RETRY_QUEUE_PREFIX:-ai.tool.normal.retry}
      RABBITMQ_RETRY_DELAYS_MS: ${RABBITMQ_RETRY_DELAYS_MS:-5000,30000,120000}
      APP_PRODUCTION_MODE: ${APP_PRODUCTION_MODE:-false}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token}
      AI_TASK_QUEUE: ${AI_TASK_QUEUE:-ai:task:queue}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_SERVICE_BASE_URL: ${AGENT_SERVICE_BASE_URL:-http://agent-service:8090}
      AGENT_MAX_ACTIVE_RUNS_PER_USER: ${AGENT_MAX_ACTIVE_RUNS_PER_USER:-1}
      AGENT_MAX_MESSAGES_PER_MINUTE: ${AGENT_MAX_MESSAGES_PER_MINUTE:-10}
      AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-30}
      AGENT_DEFAULT_CREDIT_BUDGET: ${AGENT_DEFAULT_CREDIT_BUDGET:-20}
      GENERATED_MEDIA_DIR: /data/generated-media
      # OSS / ASSET_STORAGE_* 由 env_file ../.env 注入，勿在此写默认值以免覆盖
      # Clash fake-ip (198.18.x.x) breaks direct HTTPS from containers; route via host proxy when set in deploy/.env
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,mysql,redis,rabbitmq,backend,agent-service,admin-frontend,user-web,nginx,host.docker.internal}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ../WXcert:/app/WXcert:ro
      - ../docs:/docs:ro
      - ../data/generated-media:/data/generated-media
    dns:
      # Keep backend model connectivity tests away from poisoned/default container DNS.
      - 223.5.5.5
      - 1.1.1.1
      - 8.8.8.8

  admin-frontend:
    image: ${DOCKER_REGISTRY:-docker.1ms.run/}node:22-alpine
    container_name: ai-supermarket-admin-frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      # Deploy stack defaults to production; set false only for local docker dev.
      APP_PRODUCTION_MODE: ${APP_PRODUCTION_MODE:-true}
      NEXT_PUBLIC_API_PROXY_TARGET: ${ADMIN_NEXT_PUBLIC_API_PROXY_TARGET:-http://backend:8080}
      NEXT_PUBLIC_API_BASE_URL: ${ADMIN_NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_ADMIN_BASE_PATH: ${NEXT_PUBLIC_ADMIN_BASE_PATH:-/admin}
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    ports:
      - "127.0.0.1:${ADMIN_FRONTEND_PORT:-5174}:5174"
    volumes:
      - ../admin-frontend:/app
      - admin_frontend_next:/app/.next
      - /app/node_modules            
    command: >-
      sh -c "npm config set registry https://registry.npmmirror.com && npm install &&
      if [ \"$${APP_PRODUCTION_MODE}\" = 'true' ]; then export NODE_ENV=production && npm run build && npm run start -- -H 0.0.0.0 -p 5174;
      else export CHOKIDAR_USEPOLLING=true && npm run dev:docker; fi"
    env_file:
      - ../.env

  user-web:
    image: ${DOCKER_REGISTRY:-docker.1ms.run/}node:22-alpine
    container_name: ai-supermarket-user-web
    working_dir: /app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # APP_PRODUCTION_MODE 仅由 ../.env 控制；勿在此覆盖（此前 default false 导致生产走 Vite dev 并 403）
      # 留空：浏览器请求走当前页面的 /api，由 nginx 反代到后端
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_ALIYUN_CAPTCHA_ENABLED: ${VITE_ALIYUN_CAPTCHA_ENABLED:-false}
      VITE_ALIYUN_CAPTCHA_REGION: ${VITE_ALIYUN_CAPTCHA_REGION:-cn}
      VITE_ALIYUN_CAPTCHA_PREFIX: ${VITE_ALIYUN_CAPTCHA_PREFIX:-}
      VITE_ALIYUN_CAPTCHA_SCENE_ID: ${VITE_ALIYUN_CAPTCHA_SCENE_ID:-}
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://backend:8080}
      CHOKIDAR_USEPOLLING: "true"
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    ports:
      - "127.0.0.1:${USER_WEB_PORT:-5173}:5173"
    volumes:
      - ../user-web:/app
      - /app/node_modules
      - user_web_dist:/dist-out
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ \"$$APP_PRODUCTION_MODE\" = 'true' ]; then test -f /dist-out/index.html; else wget -q -O- http://127.0.0.1:5173/ >/dev/null 2>&1; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 180s
    command: >-
      sh -c "npm config set registry https://registry.npmmirror.com && npm install &&
      if [ \"$${APP_PRODUCTION_MODE}\" = 'true' ]; then npm run build && cp -r dist/. /dist-out/ && tail -f /dev/null;
      else npm run dev -- --host 0.0.0.0 --port 5173; fi"

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.1ms.run/}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    container_name: ai-supermarket-worker
    working_dir: /app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_TRUSTED_HOST: mirrors.aliyun.com
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0
      TASK_QUEUE_BACKEND: ${TASK_QUEUE_BACKEND:-rabbitmq}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_TASK_QUEUE: ${RABBITMQ_TASK_QUEUE:-ai.tool.normal}
      RABBITMQ_DEAD_QUEUE: ${RABBITMQ_DEAD_QUEUE:-ai.tool.normal.dead}
      RABBITMQ_RETRY_QUEUE_PREFIX: ${RABBITMQ_RETRY_QUEUE_PREFIX:-ai.tool.normal.retry}
      RABBITMQ_RETRY_DELAYS_MS: ${RABBITMQ_RETRY_DELAYS_MS:-5000,30000,120000}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      # 生图任务并发消费：最多 5 个任务同时处理（prefetch 默认跟随 WORKER_CONCURRENCY）
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      RABBITMQ_PREFETCH_COUNT: ${RABBITMQ_PREFETCH_COUNT:-5}
      AI_TASK_QUEUE: ${AI_TASK_QUEUE:-ai:task:queue}
      BACKEND_INTERNAL_BASE_URL: http://backend:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token}
      GENERATED_MEDIA_DIR: /data/generated-media
      GENERATED_MEDIA_PUBLIC_BASE_URL: /generated
      # OSS / ASSET_STORAGE_* 由 env_file ../.env 注入，勿在此写默认值以免覆盖
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,mysql,redis,rabbitmq,backend,agent-service,admin-frontend,user-web,nginx,host.docker.internal}
    volumes:
      - ../worker:/app
      - ../data/generated-media:/data/generated-media
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python main.py"
    dns:
      # Avoid Clash/Fake-IP DNS poisoning inside containers (198.18.x.x)
      - 223.5.5.5
      - 1.1.1.1
      - 8.8.8.8

  agent-service:
    build:
      context: ..
      dockerfile: agent-service/Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.1ms.run/}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    container_name: ai-supermarket-agent-service
    working_dir: /app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    depends_on:
      - backend
      - redis
    environment:
      TZ: Asia/Shanghai
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_TRUSTED_HOST: mirrors.aliyun.com
      APP_ENV: local
      PORT: 8090
      BACKEND_INTERNAL_BASE_URL: http://backend:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token}
      AGENT_VERIFY_INTERNAL_SIGNATURE: ${AGENT_VERIFY_INTERNAL_SIGNATURE:-false}
      AGENT_EXECUTION_MODE: ${AGENT_EXECUTION_MODE:-background}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-3}
      AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-5}
      AGENT_MODEL_CALL_COST: ${AGENT_MODEL_CALL_COST:-1}
      AGENT_DEFAULT_CONSUMED_CREDITS: ${AGENT_DEFAULT_CONSUMED_CREDITS:-1}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,mysql,redis,rabbitmq,backend,agent-service,admin-frontend,user-web,nginx,host.docker.internal}
    ports:
      - "127.0.0.1:${AGENT_SERVICE_PORT:-8090}:8090"
    volumes:
      - ../agent-service:/app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8090"
    dns:
      # Avoid Clash/Fake-IP DNS poisoning inside containers (198.18.x.x)
      - 223.5.5.5
      - 1.1.1.1
      - 8.8.8.8

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  maven_cache:
  admin_frontend_next:
  user_web_dist:
