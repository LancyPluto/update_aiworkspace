services:
  mysql:
    image: mysql:8.0
    container_name: ai-supermarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: ai_supermarket_v1
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ai-supermarket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: maven:3.9-eclipse-temurin-17
    container_name: ai-supermarket-backend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ai_supermarket_v1
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token}
      AI_TASK_QUEUE: ${AI_TASK_QUEUE:-ai:task:queue}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ../backend:/app
      - maven_cache:/root/.m2
    command: mvn spring-boot:run

  admin-frontend:
    image: node:22-alpine
    container_name: ai-supermarket-admin-frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${ADMIN_VITE_API_BASE_URL:-}
      VITE_DEV_PROXY_TARGET: ${ADMIN_VITE_DEV_PROXY_TARGET:-http://backend:8080}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${ADMIN_FRONTEND_PORT:-5174}:5174"
    volumes:
      - ../admin-frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  user-web:
    image: node:22-alpine
    container_name: ai-supermarket-user-web
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://backend:8080}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${USER_WEB_PORT:-5173}:5173"
    volumes:
      - ../user-web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

  worker:
    image: python:3.12-slim
    container_name: ai-supermarket-worker
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0
      AI_TASK_QUEUE: ${AI_TASK_QUEUE:-ai:task:queue}
      BACKEND_INTERNAL_BASE_URL: http://backend:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-https://api.deepseek.com}
      MODEL_API_KEY: ${MODEL_API_KEY:-replace-with-model-key}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
    volumes:
      - ../worker:/app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python main.py"

volumes:
  mysql_data:
  redis_data:
  maven_cache:
