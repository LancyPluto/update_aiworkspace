services:
  mysql:
    image: mysql:8.0
    container_name: ai-supermarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: ai_supermarket_v1
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 忽略客户端握手里的字符集，统一用服务端 utf8mb4，减少 JDBC/客户端默认 latin1 导致的乱码
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  banana-slides:
    build:
      context: ../engines/banana-slides
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: ai-supermarket-banana-slides
    restart: unless-stopped
    env_file:
      - ../engines/banana-slides/.env
    ports:
      - "127.0.0.1:${BANANA_SLIDES_PORT:-5001}:5000"
      - "127.0.0.1:1455:1455"
    volumes:
      - ../engines/banana-slides/backend/instance:/app/backend/instance
      - ../engines/banana-slides/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7
    container_name: ai-supermarket-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ai-supermarket-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: maven:3.9-eclipse-temurin-17
    container_name: ai-supermarket-backend
    working_dir: /app
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      banana-slides:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ai_supermarket_v1
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      TASK_QUEUE_BACKEND: ${TASK_QUEUE_BACKEND:-rabbitmq}
      RABBITMQ_TASK_EXCHANGE: ${RABBITMQ_TASK_EXCHANGE:-ai.task.exchange}
      RABBITMQ_TASK_ROUTING_KEY: ${RABBITMQ_TASK_ROUTING_KEY:-tool.normal}
      RABBITMQ_TASK_QUEUE: ${RABBITMQ_TASK_QUEUE:-ai.tool.normal}
      RABBITMQ_DEAD_QUEUE: ${RABBITMQ_DEAD_QUEUE:-ai.tool.normal.dead}
      RABBITMQ_RETRY_QUEUE_PREFIX: ${RABBITMQ_RETRY_QUEUE_PREFIX:-ai.tool.normal.retry}
      RABBITMQ_RETRY_DELAYS_MS: ${RABBITMQ_RETRY_DELAYS_MS:-5000,30000,120000}
      APP_PRODUCTION_MODE: ${APP_PRODUCTION_MODE:-false}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token}
      AI_TASK_QUEUE: ${AI_TASK_QUEUE:-ai:task:queue}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_SERVICE_BASE_URL: ${AGENT_SERVICE_BASE_URL:-http://agent-service:8090}
      AGENT_MAX_ACTIVE_RUNS_PER_USER: ${AGENT_MAX_ACTIVE_RUNS_PER_USER:-1}
      AGENT_MAX_MESSAGES_PER_MINUTE: ${AGENT_MAX_MESSAGES_PER_MINUTE:-10}
      AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-30}
      AGENT_DEFAULT_CREDIT_BUDGET: ${AGENT_DEFAULT_CREDIT_BUDGET:-20}
      GENERATED_MEDIA_DIR: /data/generated-media
      # 默认走宿主机 5001：与 compose 内 banana-slides 映射一致；单独起 engines/banana-slides 时也适用。
      # 若 backend 与 banana-slides 同在 compose 且不用 Clash 假 IP，可设 PPT_ENGINE_BASE_URL=http://banana-slides:5000
      PPT_ENGINE_BASE_URL: ${PPT_ENGINE_BASE_URL:-http://host.docker.internal:5001}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ../backend:/app
      - ../WXcert:/app/WXcert:ro
      - ../docs:/docs:ro
      - maven_cache:/root/.m2
      - ./config/maven-settings-china.xml:/root/.m2/settings.xml:ro
      - generated_media:/data/generated-media
    command: mvn spring-boot:run

  admin-frontend:
    image: node:22-alpine
    container_name: ai-supermarket-admin-frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_PROXY_TARGET: ${ADMIN_NEXT_PUBLIC_API_PROXY_TARGET:-http://backend:8080}
      NEXT_PUBLIC_API_BASE_URL: ${ADMIN_NEXT_PUBLIC_API_BASE_URL:-}
      CHOKIDAR_USEPOLLING: "true"
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    ports:
      - "127.0.0.1:${ADMIN_FRONTEND_PORT:-5174}:5174"
    volumes:
      - ../admin-frontend:/app
      - admin_frontend_next:/app/.next
      - /app/node_modules            
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install && npm run dev:docker"

  user-web:
    image: node:22-alpine
    container_name: ai-supermarket-user-web
    working_dir: /app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # 留空：浏览器请求走当前页面的 /api，由 Vite 代理到后端（避免 localhost vs 127.0.0.1 跨域导致 Failed to fetch）
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_ALIYUN_CAPTCHA_ENABLED: ${VITE_ALIYUN_CAPTCHA_ENABLED:-false}
      VITE_ALIYUN_CAPTCHA_REGION: ${VITE_ALIYUN_CAPTCHA_REGION:-cn}
      VITE_ALIYUN_CAPTCHA_PREFIX: ${VITE_ALIYUN_CAPTCHA_PREFIX:-}
      VITE_ALIYUN_CAPTCHA_SCENE_ID: ${VITE_ALIYUN_CAPTCHA_SCENE_ID:-}
      # 本机 mvn 启动后端时，容器内代理需用 host.docker.internal，不能用已停掉的 backend 服务名
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://backend:8080}
      CHOKIDAR_USEPOLLING: "true"
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    ports:
      - "127.0.0.1:${USER_WEB_PORT:-5173}:5173"
    volumes:
      - ../user-web:/app
      - /app/node_modules     
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install && npm run dev -- --host 0.0.0.0 --port 5173"

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    container_name: ai-supermarket-worker
    working_dir: /app
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_TRUSTED_HOST: mirrors.aliyun.com
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0
      TASK_QUEUE_BACKEND: ${TASK_QUEUE_BACKEND:-rabbitmq}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_TASK_QUEUE: ${RABBITMQ_TASK_QUEUE:-ai.tool.normal}
      RABBITMQ_DEAD_QUEUE: ${RABBITMQ_DEAD_QUEUE:-ai.tool.normal.dead}
      RABBITMQ_RETRY_QUEUE_PREFIX: ${RABBITMQ_RETRY_QUEUE_PREFIX:-ai.tool.normal.retry}
      RABBITMQ_RETRY_DELAYS_MS: ${RABBITMQ_RETRY_DELAYS_MS:-5000,30000,120000}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      AI_TASK_QUEUE: ${AI_TASK_QUEUE:-ai:task:queue}
      BACKEND_INTERNAL_BASE_URL: http://backend:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token}
      GENERATED_MEDIA_DIR: /data/generated-media
      GENERATED_MEDIA_PUBLIC_BASE_URL: /generated
    volumes:
      - ../worker:/app
      - generated_media:/data/generated-media
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python main.py"

  agent-service:
    build:
      context: ..
      dockerfile: agent-service/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    container_name: ai-supermarket-agent-service
    working_dir: /app
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - backend
      - redis
    environment:
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_TRUSTED_HOST: mirrors.aliyun.com
      APP_ENV: local
      PORT: 8090
      BACKEND_INTERNAL_BASE_URL: http://backend:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token}
      AGENT_VERIFY_INTERNAL_SIGNATURE: ${AGENT_VERIFY_INTERNAL_SIGNATURE:-false}
      AGENT_EXECUTION_MODE: ${AGENT_EXECUTION_MODE:-background}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-3}
      AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-5}
      AGENT_MODEL_CALL_COST: ${AGENT_MODEL_CALL_COST:-1}
      AGENT_DEFAULT_CONSUMED_CREDITS: ${AGENT_DEFAULT_CONSUMED_CREDITS:-1}
    ports:
      - "127.0.0.1:${AGENT_SERVICE_PORT:-8090}:8090"
    volumes:
      - ../agent-service:/app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8090"

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  maven_cache:
  generated_media:
  admin_frontend_next:
