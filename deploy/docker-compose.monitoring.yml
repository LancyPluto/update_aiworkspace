# Monitoring stack for ai-tool-market.
# Run from deploy/ together with the main compose files:
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml -f docker-compose.monitoring.yml up -d
services:
  prometheus:
    image: ${DOCKER_REGISTRY:-docker.1ms.run/}prom/prometheus:v2.55.1
    container_name: ai-supermarket-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: ${DOCKER_REGISTRY:-docker.1ms.run/}grafana/grafana:11.4.0
    container_name: ai-supermarket-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://wlcloudai.com/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-123456}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_MYSQL_HOST: ${GRAFANA_MYSQL_HOST:-mysql:3306}
      GRAFANA_MYSQL_DATABASE: ${GRAFANA_MYSQL_DATABASE:-ai_supermarket_v1}
      GRAFANA_MYSQL_USER: ${GRAFANA_MYSQL_USER:-grafana_readonly}
      GRAFANA_MYSQL_PASSWORD: ${GRAFANA_MYSQL_PASSWORD:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  loki:
    image: ${DOCKER_REGISTRY:-docker.1ms.run/}grafana/loki:3.3.2
    container_name: ai-supermarket-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  alloy:
    image: ${DOCKER_REGISTRY:-docker.1ms.run/}grafana/alloy:v1.5.1
    container_name: ai-supermarket-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  node-exporter:
    image: ${DOCKER_REGISTRY:-docker.1ms.run/}prom/node-exporter:v1.8.2
    container_name: ai-supermarket-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    # cAdvisor is not hosted on Docker Hub, so do not prepend DOCKER_REGISTRY here.
    # If your production network cannot pull from gcr.io, override CADVISOR_IMAGE in deploy/.env.
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1}
    container_name: ai-supermarket-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  blackbox-exporter:
    image: ${DOCKER_REGISTRY:-docker.1ms.run/}prom/blackbox-exporter:v0.25.0
    container_name: ai-supermarket-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

