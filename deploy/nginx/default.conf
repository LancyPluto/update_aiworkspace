map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Domain HTTP -> HTTPS (certificates configured on 443)
server {
  listen 80;
  server_name wlcloudai.com www.wlcloudai.com;
  return 301 https://$host$request_uri;
}

server {
  listen 80 default_server;
  server_name 8.134.93.203 localhost 127.0.0.1;
  charset utf-8;
  charset_types *;
  client_max_body_size 25m;

  include /etc/nginx/conf.d/snippets/app_locations.conf;
}

server {
  listen 443 ssl;
  http2 on;
  server_name wlcloudai.com www.wlcloudai.com 8.134.93.203;
  charset utf-8;
  charset_types *;
  client_max_body_size 25m;

  ssl_certificate /etc/nginx/certs/wlcloudai.com.pem;
  ssl_certificate_key /etc/nginx/certs/wlcloudai.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  include /etc/nginx/conf.d/snippets/app_locations.conf;
}
