map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  application/xml
  application/xml+rss
  application/xhtml+xml
  image/svg+xml;

# www -> apex HTTPS
server {
  listen 80;
  server_name www.wlcloudai.com;
  return 301 https://wlcloudai.com$request_uri;
}

# Domain HTTP -> HTTPS redirect (healthz exempt for monitoring)
server {
  listen 80;
  server_name wlcloudai.com;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  return 301 https://wlcloudai.com$request_uri;
}

# Block IP-based HTTP access (keep /healthz for docker healthcheck)
server {
  listen 80 default_server;
  server_name _;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  return 444;
}

# Block IP-based HTTPS access (reject TLS handshake)
server {
  listen 443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
}

# Main HTTPS server (domain only)
server {
  listen 443 ssl;
  http2 on;
  server_name wlcloudai.com www.wlcloudai.com;
  charset utf-8;
  charset_types *;
  client_max_body_size 100m;

  ssl_certificate /etc/nginx/certs/wlcloudai.com.pem;
  ssl_certificate_key /etc/nginx/certs/wlcloudai.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  include /etc/nginx/conf.d/snippets/app_locations.conf;
}
