location = /healthz {
  access_log off;
  add_header Content-Type text/plain;
  return 200 "ok\n";
}

location /api/internal/ {
  return 404;
}


location /generated/ {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_buffering off;
}

location = /grafana {
  return 301 /grafana/;
}

location ^~ /grafana/ {
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $grafana_upstream http://grafana:3000;
  proxy_pass $grafana_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Prefix /grafana;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 60s;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_buffering off;
}

# Admin Next.js uses basePath=/admin; do NOT force /admin <-> /admin/ redirects (causes loop with Next 308).
location /admin {
  proxy_pass http://admin-frontend:5174;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 120s;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
}

location = /admin/_next/webpack-hmr {
  return 204;
}

# Built assets must not fall back to index.html (avoids stale-hash / vite 403 confusion).
location ^~ /assets/ {
  root /usr/share/nginx/user-web;
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

# Deploy fingerprint for prod vs local verification (no long-term cache).
location = /build-info.json {
  root /usr/share/nginx/user-web;
  default_type application/json;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  add_header Pragma "no-cache";
}

# SPA shell must not be cached long-term; stale index.html points browsers at old hashed bundles.
location = /index.html {
  root /usr/share/nginx/user-web;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  add_header Pragma "no-cache";
}

# Production serves static from user_web_dist volume; do NOT proxy to Vite dev (403 on Host check).
location / {
  root /usr/share/nginx/user-web;
  try_files $uri $uri/ /index.html;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  add_header Pragma "no-cache";
}
