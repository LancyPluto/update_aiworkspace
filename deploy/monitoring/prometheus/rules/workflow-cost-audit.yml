groups:
  - name: workflow-cost-audit
    interval: 30s
    rules:
      - alert: WorkflowProviderActualCostUnknown
        expr: increase(workflow_provider_cost_anomaly_total{reason="actual_cost_unknown"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: Workflow provider cost audit data is missing
          description: Paid workflow admission observed successful usage without optional provider cost audit data.

      - alert: WorkflowProviderCostCurrencyUnexpected
        expr: increase(workflow_provider_cost_anomaly_total{reason="currency_unsupported"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: Workflow provider cost audit currency is unexpected
          description: Paid workflow admission observed optional provider cost data outside the current CNY audit convention.

      - alert: WorkflowBillingReconciliationInconsistent
        expr: increase(workflow_reconciliation_total{result="inconsistent"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: Workflow billing reconciliation is inconsistent
          description: A workflow run has mismatched step charges, usage records, wallet deductions, or unresolved billing state. The affected run is isolated while other runs remain available.
