global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: backend-actuator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: backend

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq

  - job_name: agent-service
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-service:8090"]
        labels:
          service: agent-service

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
        labels:
          service: worker

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          service: alloy

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://backend:8080/api/health
          - http://agent-service:8090/health
        labels:
          group: internal-http
    relabel_configs: &blackbox_http_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-http-nginx
    metrics_path: /probe
    params:
      module: [http_2xx_wlcloud]
    static_configs:
      - targets:
          - http://nginx/healthz
        labels:
          group: nginx-http
    relabel_configs: *blackbox_http_relabel

  - job_name: blackbox-http-public
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://wlcloudai.com/
        labels:
          group: public-http
    relabel_configs: *blackbox_http_relabel

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - mysql:3306
          - redis:6379
          - rabbitmq:5672
          - host.docker.internal:7890
        labels:
          group: internal-tcp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

