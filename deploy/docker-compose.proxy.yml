services:
  mihomo-init:
    image: ${MIHOMO_INIT_IMAGE:-alpine:3.20}
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /config/config.yaml ]; then
          cp /seed/config.yaml /config/config.yaml
        fi
    volumes:
      - ./mihomo/config.base.yaml:/seed/config.yaml:ro
      - mihomo_config:/config

  mihomo:
    image: ${MIHOMO_IMAGE:-metacubex/mihomo:latest}
    container_name: ai-supermarket-mihomo
    restart: unless-stopped
    depends_on:
      mihomo-init:
        condition: service_completed_successfully
    command:
      - -d
      - /root/.config/mihomo
      - -f
      - /root/.config/mihomo/config.yaml
      - -ext-ctl
      - 0.0.0.0:9090
      - -secret
      - ${MIHOMO_CONTROLLER_SECRET:?MIHOMO_CONTROLLER_SECRET is required when Mihomo is enabled}
    ports:
      - "127.0.0.1:${MIHOMO_PROXY_PORT:-7890}:7890"
    volumes:
      - mihomo_config:/root/.config/mihomo

  backend:
    depends_on:
      mihomo:
        condition: service_started
    environment:
      MIHOMO_RUNTIME_ENABLED: "true"
      MIHOMO_CONTROLLER_URL: http://mihomo:9090
      MIHOMO_CONTROLLER_SECRET: ${MIHOMO_CONTROLLER_SECRET:?MIHOMO_CONTROLLER_SECRET is required when Mihomo is enabled}
      MIHOMO_CONFIG_PATH: /data/mihomo/config.yaml
      MIHOMO_RELOAD_PATH: /root/.config/mihomo/config.yaml
      PROJECT_MIHOMO_PROXY_URL: http://mihomo:7890
      HTTP_PROXY: http://mihomo:7890
      HTTPS_PROXY: http://mihomo:7890
      ALL_PROXY: ""
      http_proxy: http://mihomo:7890
      https_proxy: http://mihomo:7890
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,::1,mysql,redis,rabbitmq,backend,worker,agent-service,admin-frontend,user-web,nginx,mihomo,host.docker.internal"
      no_proxy: "localhost,127.0.0.1,::1,mysql,redis,rabbitmq,backend,worker,agent-service,admin-frontend,user-web,nginx,mihomo,host.docker.internal"
      JAVA_TOOL_OPTIONS: "${BACKEND_JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=10.0 -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom} -Dhttp.proxyHost=mihomo -Dhttp.proxyPort=7890 -Dhttps.proxyHost=mihomo -Dhttps.proxyPort=7890 -Dhttp.nonProxyHosts=localhost|127.*|[::1]|mysql|redis|rabbitmq|backend|worker|agent-service|admin-frontend|user-web|nginx|mihomo|host.docker.internal"
    volumes:
      - mihomo_config:/data/mihomo

  worker:
    environment:
      PROJECT_MIHOMO_PROXY_URL: http://mihomo:7890
      HTTP_PROXY: http://mihomo:7890
      HTTPS_PROXY: http://mihomo:7890
      ALL_PROXY: ""
      http_proxy: http://mihomo:7890
      https_proxy: http://mihomo:7890
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,::1,mysql,redis,rabbitmq,backend,worker,agent-service,admin-frontend,user-web,nginx,mihomo,host.docker.internal"
      no_proxy: "localhost,127.0.0.1,::1,mysql,redis,rabbitmq,backend,worker,agent-service,admin-frontend,user-web,nginx,mihomo,host.docker.internal"

  agent-service:
    environment:
      PROJECT_MIHOMO_PROXY_URL: http://mihomo:7890
      HTTP_PROXY: http://mihomo:7890
      HTTPS_PROXY: http://mihomo:7890
      ALL_PROXY: ""
      http_proxy: http://mihomo:7890
      https_proxy: http://mihomo:7890
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,::1,mysql,redis,rabbitmq,backend,worker,agent-service,admin-frontend,user-web,nginx,mihomo,host.docker.internal"
      no_proxy: "localhost,127.0.0.1,::1,mysql,redis,rabbitmq,backend,worker,agent-service,admin-frontend,user-web,nginx,mihomo,host.docker.internal"

volumes:
  mihomo_config:
