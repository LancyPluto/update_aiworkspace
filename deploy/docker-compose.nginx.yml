services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ai-supermarket-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - user-web
      - admin-frontend
    ports:
      # 生产默认 80，便于 http://<公网IP>/ 直接访问；本地若 80 被占用可设 NGINX_HTTP_PORT=8088
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
