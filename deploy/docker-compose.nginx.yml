services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ai-supermarket-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - user-web
      - admin-frontend
    ports:
      - "${NGINX_HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
